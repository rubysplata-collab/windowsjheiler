<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P2P Foto Chat</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161922;
    --border: #262b36;
    --accent: #4f8cff;
    --text: #e7e9ee;
    --muted: #8b93a3;
    --bubble-me: #2a5bd7;
    --bubble-them: #232733;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 480px;
    height: 100vh;
    max-height: 900px;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border: 1px solid var(--border);
  }
  @media (min-width: 500px) {
    .app { height: 90vh; border-radius: 16px; overflow: hidden; }
  }

  /* Pantalla de conexión */
  #connectScreen {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 32px 24px;
    gap: 20px;
  }
  #connectScreen h1 {
    font-size: 20px;
    margin: 0 0 4px;
    text-align: center;
  }
  #connectScreen p.sub {
    color: var(--muted);
    text-align: center;
    font-size: 14px;
    margin: 0 0 12px;
  }
  .myCodeBox {
    background: #10131a;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    text-align: center;
  }
  .myCodeBox label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .myCode {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--accent);
    font-family: "SF Mono", Consolas, monospace;
  }
  .myCodeStatus {
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
  }
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--muted);
    font-size: 12px;
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--border);
  }
  .joinRow {
    display: flex;
    gap: 8px;
  }
  #peerCodeInput {
    flex: 1;
    background: #10131a;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 14px;
    border-radius: 10px;
    font-size: 18px;
    font-family: "SF Mono", Consolas, monospace;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  #peerCodeInput:focus { outline: none; border-color: var(--accent); }
  button {
    cursor: pointer;
    border: none;
    font-weight: 600;
  }
  #connectBtn {
    background: var(--accent);
    color: white;
    padding: 14px 18px;
    border-radius: 10px;
    font-size: 15px;
    white-space: nowrap;
  }
  #connectBtn:disabled { opacity: 0.5; cursor: default; }
  #connectMsg {
    font-size: 13px;
    text-align: center;
    min-height: 18px;
    color: var(--muted);
  }
  #connectMsg.error { color: #ff6b6b; }
  #connectMsg.ok { color: #4dd47a; }

  .choiceButtons {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 8px;
  }
  .bigChoiceBtn {
    display: flex;
    align-items: center;
    gap: 14px;
    background: #10131a;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 18px 20px;
    border-radius: 14px;
    font-size: 16px;
    text-align: left;
  }
  .bigChoiceBtn:hover { border-color: var(--border-strong, #3a4150); }
  .bigChoiceBtn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }
  .bigChoiceIcon {
    font-size: 20px;
    width: 28px;
    text-align: center;
    flex-shrink: 0;
  }
  .backBtn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 14px;
    padding: 8px 0;
    margin-top: 8px;
    text-align: left;
  }

  /* Pantalla de chat */
  #chatScreen { display: none; flex: 1; flex-direction: column; min-height: 0; }
  .chatHeader {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .chatHeader .info { display: flex; align-items: center; gap: 8px; }
  .headerText { display: flex; flex-direction: column; }
  .myCodeLabel { font-size: 11px; color: var(--muted); font-family: monospace; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #e0a83e; flex-shrink: 0; }
  .dot.connected { background: #4dd47a; }
  .chatHeader .code { font-family: monospace; font-size: 13px; color: var(--text); }
  .disconnectBtn {
    background: none;
    color: var(--muted);
    font-size: 13px;
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 75%;
    padding: 10px 12px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.4;
    word-wrap: break-word;
  }
  .msg.me { align-self: flex-end; background: var(--bubble-me); color: white; border-bottom-right-radius: 4px; }
  .msg.them { align-self: flex-start; background: var(--bubble-them); border-bottom-left-radius: 4px; }
  .msg img {
    max-width: 100%;
    border-radius: 8px;
    display: block;
    margin-top: 4px;
    cursor: pointer;
  }
  .msg .caption { margin: 0; }
  .msg .time { font-size: 10px; opacity: 0.6; margin-top: 4px; }
  .systemMsg {
    align-self: center;
    font-size: 12px;
    color: var(--muted);
    background: rgba(255,255,255,0.03);
    padding: 4px 10px;
    border-radius: 10px;
  }
  .inputBar {
    padding: 10px 12px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }
  #textInput {
    flex: 1;
    background: #10131a;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 14px;
    resize: none;
    max-height: 100px;
    font-family: inherit;
  }
  #textInput:focus { outline: none; border-color: var(--accent); }
  .iconBtn {
    background: #10131a;
    border: 1px solid var(--border);
    color: var(--text);
    width: 42px;
    height: 42px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  #sendBtn {
    background: var(--accent);
    color: white;
    width: 42px;
    height: 42px;
    border-radius: 10px;
    flex-shrink: 0;
  }
  #fileInput { display: none; }
  #imgPreviewBar {
    display: none;
    padding: 8px 12px 0;
    align-items: center;
    gap: 8px;
  }
  #imgPreviewBar img {
    height: 50px;
    width: 50px;
    object-fit: cover;
    border-radius: 8px;
  }
  #imgPreviewBar .cancelPreview {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    width: 26px;
    height: 26px;
    border-radius: 50%;
    font-size: 14px;
  }
  #lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    z-index: 999;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  #lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }
</style>
</head>
<body>

<div class="app">

  <!-- PANTALLA DE CONEXIÓN -->
  <div id="connectScreen">

    <!-- Vista inicial: elegir modo -->
    <div id="modeChoice">
      <h1>Foto chat P2P</h1>
      <p class="sub">Conexión directa entre dos navegadores. Nada se guarda en ningún servidor.</p>
      <div class="choiceButtons">
        <button id="createRoomBtn" class="bigChoiceBtn primary">
          <span class="bigChoiceIcon">＋</span>
          <span>Crear sala</span>
        </button>
        <button id="joinRoomBtn" class="bigChoiceBtn">
          <span class="bigChoiceIcon">→</span>
          <span>Unirme a una sala</span>
        </button>
      </div>
    </div>

    <!-- Vista: unirse con un código -->
    <div id="joinView" style="display:none;">
      <h1>Unirme a una sala</h1>
      <p class="sub">Ingresá el código que te compartieron.</p>
      <div class="joinRow">
        <input type="text" id="peerCodeInput" placeholder="XD-4429" maxlength="9">
        <button id="connectBtn">Conectar</button>
      </div>
      <div id="connectMsg"></div>
      <button id="backFromJoinBtn" class="backBtn">← Volver</button>
    </div>

  </div>

  <!-- PANTALLA DE CHAT -->
  <div id="chatScreen">
    <div class="chatHeader">
      <div class="info">
        <span class="dot" id="statusDot"></span>
        <div class="headerText">
          <span class="myCodeLabel" id="myCodeLabelHeader">Tu código: ••••••••</span>
          <span class="code" id="statusLabel">Generando…</span>
        </div>
      </div>
      <button class="disconnectBtn" id="disconnectBtn">Salir</button>
    </div>
    <div id="messages"></div>
    <div id="imgPreviewBar">
      <img id="imgPreviewThumb" src="" alt="preview">
      <span style="font-size:13px;color:var(--muted);flex:1">Imagen lista para enviar</span>
      <button class="cancelPreview" id="cancelPreviewBtn">✕</button>
    </div>
    <div class="inputBar">
      <button class="iconBtn" id="attachBtn" title="Adjuntar foto">📷</button>
      <input type="file" id="fileInput" accept="image/*">
      <textarea id="textInput" placeholder="Escribí un mensaje…" rows="1"></textarea>
      <button id="sendBtn">➤</button>
    </div>
  </div>

</div>

<div id="lightbox">
  <img id="lightboxImg" src="" alt="">
</div>

<script>
(function () {
  if (typeof Peer === "undefined") {
    document.getElementById("connectScreen").innerHTML =
      '<p style="text-align:center;color:#ff6b6b;padding:32px;">No se pudo cargar la librería de conexión (PeerJS). Revisá tu conexión a internet y recargá la página.</p>';
    return;
  }

  const CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ"; // sin letras ambiguas
  function randomCode() {
    let letters = "";
    for (let i = 0; i < 2; i++) letters += CHARS[Math.floor(Math.random() * CHARS.length)];
    const digits = String(Math.floor(1000 + Math.random() * 9000));
    return letters + "-" + digits;
  }

  function codeToPeerId(code) {
    // Namespace para no colisionar con otros usuarios del servidor público de PeerJS
    return "fotop2p-" + code.replace("-", "").toUpperCase();
  }

  const modeChoice = document.getElementById("modeChoice");
  const joinView = document.getElementById("joinView");
  const createRoomBtn = document.getElementById("createRoomBtn");
  const joinRoomBtn = document.getElementById("joinRoomBtn");
  const backFromJoinBtn = document.getElementById("backFromJoinBtn");

  const peerCodeInput = document.getElementById("peerCodeInput");
  const connectBtn = document.getElementById("connectBtn");
  const connectMsg = document.getElementById("connectMsg");

  const connectScreen = document.getElementById("connectScreen");
  const chatScreen = document.getElementById("chatScreen");
  const myCodeLabelHeader = document.getElementById("myCodeLabelHeader");
  const statusLabel = document.getElementById("statusLabel");
  const statusDot = document.getElementById("statusDot");
  const messagesEl = document.getElementById("messages");
  const textInput = document.getElementById("textInput");
  const sendBtn = document.getElementById("sendBtn");
  const attachBtn = document.getElementById("attachBtn");
  const fileInput = document.getElementById("fileInput");
  const imgPreviewBar = document.getElementById("imgPreviewBar");
  const imgPreviewThumb = document.getElementById("imgPreviewThumb");
  const cancelPreviewBtn = document.getElementById("cancelPreviewBtn");
  const disconnectBtn = document.getElementById("disconnectBtn");
  const lightbox = document.getElementById("lightbox");
  const lightboxImg = document.getElementById("lightboxImg");

  let myCode = null;
  let peer = null;
  let conn = null;
  let pendingImageDataUrl = null;

  function setStatus(text, connected) {
    statusLabel.textContent = text;
    statusDot.classList.toggle("connected", !!connected);
  }

  function showView(view) {
    modeChoice.style.display = view === "modeChoice" ? "block" : "none";
    joinView.style.display = view === "joinView" ? "block" : "none";
    connectScreen.style.display = view === "chatScreen" ? "none" : "flex";
    chatScreen.style.display = view === "chatScreen" ? "flex" : "none";
  }

  const PEER_CONFIG = {
    debug: 2,
    config: {
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "stun:stun1.l.google.com:19302" },
        { urls: "stun:global.stun.twilio.com:3478" },
        {
          urls: "turn:openrelay.metered.ca:80",
          username: "openrelayproject",
          credential: "openrelayproject"
        },
        {
          urls: "turn:openrelay.metered.ca:443",
          username: "openrelayproject",
          credential: "openrelayproject"
        },
        {
          urls: "turn:openrelay.metered.ca:443?transport=tcp",
          username: "openrelayproject",
          credential: "openrelayproject"
        },
        {
          urls: "turn:relay1.expressturn.com:3478",
          username: "efQUQ79N77B5BNVVKF",
          credential: "N4EAUgpjMzPLrxSS"
        }
      ]
    }
  };

  function ensurePeer(onOpen) {
    if (peer && !peer.destroyed) { onOpen(); return; }
    myCode = randomCode();
    peer = new Peer(codeToPeerId(myCode), PEER_CONFIG);

    peer.on("open", () => { onOpen(); });

    peer.on("error", (err) => {
      console.error(err);
      if (err.type === "unavailable-id") {
        // muy raro con código random, pero por si acaso generamos otro
        myCode = randomCode();
        peer.destroy();
        peer = new Peer(codeToPeerId(myCode), PEER_CONFIG);
        peer.on("open", onOpen);
        return;
      }
      if (err.type === "peer-unavailable") {
        connectMsg.textContent = "No se encontró ese código. Revisá que esté bien escrito y que la otra persona tenga la sala abierta.";
        connectMsg.className = "error";
        connectBtn.disabled = false;
        connectBtn.textContent = "Conectar";
      } else if (err.type === "browser-incompatible") {
        connectMsg.textContent = "Este navegador no soporta WebRTC.";
        connectMsg.className = "error";
      } else if (err.type === "network" || err.type === "server-error" || err.type === "socket-error" || err.type === "socket-closed") {
        connectMsg.textContent = "No se pudo conectar al servidor de señalización. Revisá tu conexión a internet.";
        connectMsg.className = "error";
        connectBtn.disabled = false;
        connectBtn.textContent = "Conectar";
        setStatus("Error de conexión al servidor…", false);
      } else {
        connectMsg.textContent = "Error: " + err.type;
        connectMsg.className = "error";
        connectBtn.disabled = false;
        connectBtn.textContent = "Conectar";
        setStatus("Error de conexión al servidor…", false);
      }
    });

    peer.on("connection", (incomingConn) => {
      if (conn) { incomingConn.close(); return; }
      setupConnection(incomingConn, incomingConn.peer);
    });

    peer.on("disconnected", () => {
      if (peer && !peer.destroyed) peer.reconnect();
    });
  }

  // --- Navegación entre vistas ---
  createRoomBtn.addEventListener("click", () => {
    myCodeLabelHeader.textContent = "Tu código: ••••••••";
    setStatus("Generando…", false);
    showView("chatScreen");
    ensurePeer(() => {
      myCodeLabelHeader.textContent = "Tu código: " + myCode;
      setStatus("Esperando a que se conecten…", false);
    });
  });

  joinRoomBtn.addEventListener("click", () => {
    showView("joinView");
    peerCodeInput.value = "";
    connectMsg.textContent = "";
    peerCodeInput.focus();
    ensurePeer(() => {});
  });

  backFromJoinBtn.addEventListener("click", () => {
    if (peer && !peer.destroyed) peer.destroy();
    peer = null;
    myCode = null;
    showView("modeChoice");
  });

  function setupConnection(c, remotePeerId) {
    conn = c;
    const displayCode = remotePeerId.replace("fotop2p-", "");
    const formatted = displayCode.slice(0, 2) + "-" + displayCode.slice(2);

    if (c.open) {
      onConnectionOpen(formatted);
    } else {
      conn.on("open", () => onConnectionOpen(formatted));
    }

    conn.on("data", (data) => {
      if (data.type === "text") {
        addMsg(data.text, "them");
      } else if (data.type === "image") {
        addImageMsg(data.dataUrl, data.caption, "them");
      }
    });

    conn.on("close", () => {
      setStatus("Desconectado", false);
      addSystemMsg("La otra persona se desconectó.");
      conn = null;
    });

    conn.on("error", (err) => {
      console.error(err);
      addSystemMsg("Error en la conexión.");
    });
  }

  function onConnectionOpen(formatted) {
    showView("chatScreen");
    myCodeLabelHeader.textContent = "Tu código: " + myCode;
    setStatus("Conectado con " + formatted, true);
    addSystemMsg("Conectado con " + formatted);
  }

  connectBtn.addEventListener("click", () => {
    const raw = peerCodeInput.value.trim().toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (raw.length < 6) {
      connectMsg.textContent = "Ingresá un código válido, ej: XD-4429";
      connectMsg.className = "error";
      return;
    }
    const targetId = "fotop2p-" + raw;
    if (myCode && targetId === codeToPeerId(myCode)) {
      connectMsg.textContent = "Ese es tu propio código.";
      connectMsg.className = "error";
      return;
    }
    connectBtn.disabled = true;
    connectBtn.textContent = "Conectando…";
    connectMsg.textContent = "";

    function doConnect() {
      const outgoing = peer.connect(targetId, { reliable: true });
      let settled = false;
      connectMsg.textContent = "Buscando conexión con la otra persona…";
      connectMsg.className = "";

      outgoing.on("open", () => {
        settled = true;
        setupConnection(outgoing, targetId);
      });

      outgoing.on("error", (err) => {
        console.error(err);
        if (!settled) {
          settled = true;
          connectBtn.disabled = false;
          connectBtn.textContent = "Conectar";
          connectMsg.textContent = "Error al conectar: " + (err.type || err.message || err);
          connectMsg.className = "error";
        }
      });

      // Log de progreso ICE visible en pantalla, útil en redes móviles/restrictivas
      if (outgoing.peerConnection) {
        outgoing.peerConnection.addEventListener("iceconnectionstatechange", () => {
          const state = outgoing.peerConnection.iceConnectionState;
          console.log("ICE state:", state);
          if (!settled) {
            if (state === "checking") connectMsg.textContent = "Probando ruta de conexión (esto puede tardar en redes móviles)…";
            if (state === "failed") {
              connectMsg.textContent = "La ruta de conexión falló. Puede ser un bloqueo de red (datos móviles/firewall). Probá con wifi.";
              connectMsg.className = "error";
            }
          }
        });
      }

      setTimeout(() => {
        if (!settled) {
          connectBtn.disabled = false;
          connectBtn.textContent = "Conectar";
          connectMsg.textContent = "No se pudo conectar tras 25s. Probá que ambos estén en wifi, o revisá el código.";
          connectMsg.className = "error";
        }
      }, 25000);
    }

    if (peer && peer.open) {
      doConnect();
    } else {
      ensurePeer(doConnect);
    }
  });

  peerCodeInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") connectBtn.click();
  });
  peerCodeInput.addEventListener("input", () => {
    let v = peerCodeInput.value.toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (v.length > 2) v = v.slice(0, 2) + "-" + v.slice(2, 6);
    peerCodeInput.value = v;
  });

  function nowStr() {
    const d = new Date();
    return d.getHours().toString().padStart(2, "0") + ":" + d.getMinutes().toString().padStart(2, "0");
  }

  function addSystemMsg(text) {
    const div = document.createElement("div");
    div.className = "systemMsg";
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addMsg(text, who) {
    const div = document.createElement("div");
    div.className = "msg " + who;
    const p = document.createElement("p");
    p.className = "caption";
    p.textContent = text;
    div.appendChild(p);
    const t = document.createElement("div");
    t.className = "time";
    t.textContent = nowStr();
    div.appendChild(t);
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addImageMsg(dataUrl, caption, who) {
    const div = document.createElement("div");
    div.className = "msg " + who;
    if (caption) {
      const p = document.createElement("p");
      p.className = "caption";
      p.textContent = caption;
      div.appendChild(p);
    }
    const img = document.createElement("img");
    img.src = dataUrl;
    img.addEventListener("click", () => {
      lightboxImg.src = dataUrl;
      lightbox.style.display = "flex";
    });
    div.appendChild(img);
    const t = document.createElement("div");
    t.className = "time";
    t.textContent = nowStr();
    div.appendChild(t);
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  lightbox.addEventListener("click", () => { lightbox.style.display = "none"; });

  function sendMessage() {
    const text = textInput.value.trim();
    if (!conn || !conn.open) { addSystemMsg("No hay conexión activa."); return; }

    if (pendingImageDataUrl) {
      conn.send({ type: "image", dataUrl: pendingImageDataUrl, caption: text });
      addImageMsg(pendingImageDataUrl, text, "me");
      pendingImageDataUrl = null;
      imgPreviewBar.style.display = "none";
      fileInput.value = "";
      textInput.value = "";
      autoGrow();
      return;
    }

    if (!text) return;
    conn.send({ type: "text", text: text });
    addMsg(text, "me");
    textInput.value = "";
    autoGrow();
  }

  sendBtn.addEventListener("click", sendMessage);
  textInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  function autoGrow() {
    textInput.style.height = "auto";
    textInput.style.height = Math.min(textInput.scrollHeight, 100) + "px";
  }
  textInput.addEventListener("input", autoGrow);

  attachBtn.addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", () => {
    const file = fileInput.files[0];
    if (!file) return;
    if (!file.type.startsWith("image/")) {
      addSystemMsg("Solo se pueden enviar imágenes.");
      return;
    }
    const reader = new FileReader();
    reader.onload = (e) => {
      // Comprimir/redimensionar para que viaje más liviano por el canal de datos
      const img = new Image();
      img.onload = () => {
        const maxDim = 1280;
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) {
          if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        pendingImageDataUrl = canvas.toDataURL("image/jpeg", 0.8);
        imgPreviewThumb.src = pendingImageDataUrl;
        imgPreviewBar.style.display = "flex";
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });

  cancelPreviewBtn.addEventListener("click", () => {
    pendingImageDataUrl = null;
    fileInput.value = "";
    imgPreviewBar.style.display = "none";
  });

  disconnectBtn.addEventListener("click", () => {
    if (conn) conn.close();
    location.reload();
  });

  showView("modeChoice");
})();
</script>

</body>
</html>
