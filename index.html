<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XD Social</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#0d0d0f;
 color:#fff;
 font-family:Arial,sans-serif;
 height:100vh;
 display:flex;
 align-items:center;
 justify-content:center
}
.app{
 width:95%;
 max-width:850px;
 height:90vh;
 background:#171719;
 border-radius:20px;
 overflow:hidden;
 box-shadow:0 20px 60px #000
}
header{
 height:65px;
 background:#202023;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 18px;
 border-bottom:1px solid #333
}
.logo{
 font-size:21px;
 font-weight:bold
}
.room{
 background:#303034;
 padding:9px 13px;
 border-radius:10px;
 cursor:pointer;
 font-weight:bold
}
#inicio{
 height:calc(100% - 65px);
 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:center;
 gap:15px;
 padding:20px
}
#inicio h1{
 font-size:38px;
 margin:0
}
#inicio p{
 opacity:.6;
 margin:0 0 10px
}
input{
 border:0;
 outline:0;
 background:#29292d;
 color:white;
 border-radius:11px;
 padding:14px;
 font-size:15px
}
#nombre,#codigo{
 width:290px
}
button{
 border:0;
 border-radius:11px;
 padding:13px 20px;
 font-weight:bold;
 cursor:pointer
}
button:hover{
 opacity:.8
}
.primary{
 background:white;
 color:#111
}
.secondary{
 background:#303034;
 color:white
}
#estado{
 font-size:13px;
 opacity:.6;
 min-height:18px;
 text-align:center
}
#sala{
 height:calc(100% - 65px);
 display:none;
 flex-direction:column
}
.info{
 padding:10px 15px;
 background:#1d1d20;
 border-bottom:1px solid #333;
 font-size:13px;
 display:flex;
 justify-content:space-between
}
#usuarios{
 opacity:.7
}
#mensajes{
 flex:1;
 overflow-y:auto;
 padding:18px
}
.mensaje{
 max-width:75%;
 background:#29292d;
 border-radius:14px;
 padding:9px 12px;
 margin-bottom:10px;
 word-break:break-word
}
.mio{
 margin-left:auto;
 background:#414146
}
.nombre{
 font-size:11px;
 opacity:.55;
 margin-bottom:4px
}
.mensaje img{
 max-width:280px;
 border-radius:10px;
 display:block;
 margin-top:5px
}
.sistema{
 text-align:center;
 opacity:.45;
 font-size:12px;
 margin:10px
}
.composer{
 display:flex;
 gap:8px;
 padding:12px;
 background:#202023
}
.composer input{
 flex:1;
 min-width:0
}
.photo{
 width:45px;
 display:flex;
 justify-content:center;
 align-items:center;
 font-size:21px;
 cursor:pointer
}
#foto{
 display:none
}
</style>
</head>

<body>

<div class="app">

<header>
 <div class="logo">XD Social</div>
 <div class="room" id="roomTop">Sin sala</div>
</header>

<section id="inicio">

 <h1>XD Social</h1>
 <p>Red social P2P con WebRTC</p>

 <input id="nombre" placeholder="Tu nombre">

 <input id="codigo" placeholder="Código: XD-423" maxlength="6">

 <div>
  <button class="primary" onclick="crearSala()">Crear sala</button>
  <button class="secondary" onclick="entrarSala()">Entrar</button>
 </div>

 <div id="estado"></div>

</section>

<section id="sala">

 <div class="info">
  <span id="textoSala">Sala</span>
  <span id="usuarios">🟢 1 conectado</span>
 </div>

 <div id="mensajes"></div>

 <div class="composer">

  <label class="photo">
   📷
   <input id="foto" type="file" accept="image/*">
  </label>

  <input id="texto" placeholder="Escribe un mensaje...">

  <button class="primary" onclick="enviarMensaje()">➤</button>

 </div>

</section>

</div>

<script>

let peer=null;
let anfitrion=false;
let codigoSala="";
let nombre="";
let conexiones=[];
let nombres={};

const $=x=>document.getElementById(x);

function generarCodigo(){

 const letras="ABCDEFGHIJKLMNOPQRSTUVWXYZ";

 let a=letras[Math.floor(Math.random()*26)];
 let b=letras[Math.floor(Math.random()*26)];
 let n=Math.floor(100+Math.random()*900);

 return a+b+"-"+n;
}

function idPeer(codigo){
 return codigo.replace("-","");
}

function limpiarCodigo(codigo){

 return codigo
 .trim()
 .toUpperCase()
 .replace(/\s/g,"");

}

function crearSala(){

 nombre=$("nombre").value.trim() || "Anónimo";

 codigoSala=generarCodigo();

 anfitrion=true;

 iniciarPeer(idPeer(codigoSala));

}

function entrarSala(){

 nombre=$("nombre").value.trim() || "Anónimo";

 let codigo=limpiarCodigo($("codigo").value);

 if(!/^[A-Z]{2}-[0-9]{3}$/.test(codigo)){

  $("estado").textContent="Usa un código como XD-423";

  return;
 }

 codigoSala=codigo;

 anfitrion=false;

 iniciarPeer("u"+Math.random().toString(36).slice(2,10));

}

function iniciarPeer(id){

 $("estado").textContent="Conectando...";

 peer=new Peer(id,{
  debug:0
 });

 peer.on("open",()=>{

  if(anfitrion){

   abrirSala();

   agregarSistema(
    "Sala creada. Comparte el código "+codigoSala
   );

  }else{

   abrirSala();

   conectarAnfitrion();

  }

 });

 peer.on("connection",conexion=>{

  if(anfitrion){

   prepararConexion(conexion);

  }

 });

 peer.on("error",error=>{

  console.log(error);

  if(error.type==="unavailable-id"){

   $("estado").textContent=
   "Ese código ya está ocupado. Crea otra sala.";

   return;

  }

  $("estado").textContent=
  "Error de conexión: "+error.type;

 });

 peer.on("disconnected",()=>{

  $("estado").textContent="Conexión perdida";

 });

}

function abrirSala(){

 $("inicio").style.display="none";
 $("sala").style.display="flex";

 $("roomTop").textContent=codigoSala;

 $("textoSala").textContent=
 "Sala "+codigoSala;

 actualizarUsuarios();

}

function conectarAnfitrion(){

 let conexion=peer.connect(
  idPeer(codigoSala),
  {reliable:true}
 );

 prepararConexion(conexion);

}

function prepararConexion(conexion){

 conexion.on("open",()=>{

  if(!conexiones.includes(conexion)){

   conexiones.push(conexion);

  }

  conexion.send({
   tipo:"entrada",
   nombre:nombre
  });

  actualizarUsuarios();

 });

 conexion.on("data",datos=>{

  recibir(datos,conexion);

 });

 conexion.on("close",()=>{

  conexiones=
  conexiones.filter(x=>x!==conexion);

  actualizarUsuarios();

 });

}

function recibir(datos,conexion){

 if(!datos || !datos.tipo)return;

 if(datos.tipo==="entrada"){

  nombres[conexion.peer]=datos.nombre;

  agregarSistema(
   datos.nombre+" entró a la sala"
  );

  if(anfitrion){

   enviarATodos(datos,conexion);

  }

  actualizarUsuarios();

  return;
 }

 if(datos.tipo==="mensaje"){

  agregarMensaje(
   datos.nombre,
   datos.texto,
   false
  );

  if(anfitrion){

   enviarATodos(datos,conexion);

  }

  return;
 }

 if(datos.tipo==="foto"){

  agregarFoto(
   datos.nombre,
   datos.imagen,
   false
  );

  if(anfitrion){

   enviarATodos(datos,conexion);

  }

  return;
 }

}

function enviarATodos(datos,excepto=null){

 conexiones.forEach(c=>{

  if(c!==excepto && c.open){

   try{
    c.send(datos);
   }catch(e){}

  }

 });

}

function enviarMensaje(){

 let campo=$("texto");

 let texto=campo.value.trim();

 if(!texto)return;

 let datos={
  tipo:"mensaje",
  nombre:nombre,
  texto:texto
 };

 agregarMensaje(
  nombre,
  texto,
  true
 );

 if(anfitrion){

  enviarATodos(datos);

 }else{

  conexiones.forEach(c=>{

   if(c.open){

    c.send(datos);

   }

  });

 }

 campo.value="";

}

$("texto").addEventListener(
 "keydown",
 e=>{
  if(e.key==="Enter"){
   enviarMensaje();
  }
 }
);

$("foto").addEventListener(
 "change",
 e=>{

  let archivo=e.target.files[0];

  if(!archivo)return;

  if(archivo.size>4*1024*1024){

   alert("La foto debe pesar menos de 4 MB");

   return;

  }

  let lector=new FileReader();

  lector.onload=()=>{

   let datos={
    tipo:"foto",
    nombre:nombre,
    imagen:lector.result
   };

   agregarFoto(
    nombre,
    lector.result,
    true
   );

   if(anfitrion){

    enviarATodos(datos);

   }else{

    conexiones.forEach(c=>{

     if(c.open){

      c.send(datos);

     }

    });

   }

  };

  lector.readAsDataURL(archivo);

  e.target.value="";

 });

function agregarMensaje(nombre,texto,mio){

 let caja=document.createElement("div");

 caja.className=
 "mensaje"+(mio?" mio":"");

 let titulo=document.createElement("div");

 titulo.className="nombre";
 titulo.textContent=nombre;

 let contenido=document.createElement("div");

 contenido.textContent=texto;

 caja.appendChild(titulo);
 caja.appendChild(contenido);

 $("mensajes").appendChild(caja);

 bajar();

}

function agregarFoto(nombre,imagen,mio){

 let caja=document.createElement("div");

 caja.className=
 "mensaje"+(mio?" mio":"");

 let titulo=document.createElement("div");

 titulo.className="nombre";
 titulo.textContent=nombre;

 let img=document.createElement("img");

 img.src=imagen;

 caja.appendChild(titulo);
 caja.appendChild(img);

 $("mensajes").appendChild(caja);

 bajar();

}

function agregarSistema(texto){

 let caja=document.createElement("div");

 caja.className="sistema";

 caja.textContent=texto;

 $("mensajes").appendChild(caja);

 bajar();

}

function bajar(){

 let mensajes=$("mensajes");

 mensajes.scrollTop=mensajes.scrollHeight;

}

function actualizarUsuarios(){

 let total=1+conexiones.length;

 $("usuarios").textContent=
 "🟢 "+total+
 (total===1?" conectado":" conectados");

}

$("roomTop").onclick=()=>{

 if(!codigoSala)return;

 navigator.clipboard.writeText(codigoSala)
 .then(()=>{

  let anterior=$("roomTop").textContent;

  $("roomTop").textContent="¡Copiado!";

  setTimeout(()=>{

   $("roomTop").textContent=anterior;

  },1000);

 });

};

</script>

</body>
</html>
