<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XD Social Pro - Salas, Archivos y Juegos</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#111;
 color:white;
 height:100vh;
 display:flex;
 justify-content:center;
 align-items:center
}
.app{
 width:95%;
 max-width:1050px;
 height:92vh;
 background:#181818;
 border-radius:18px;
 overflow:hidden;
 box-shadow:0 0 30px #000;
 display:flex;
 flex-direction:column;
}
.top{
 height:65px;
 background:#202020;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 20px;
 border-bottom:1px solid #333
}
.logo{
 font-size:22px;
 font-weight:bold;
 display:flex;
 gap:15px;
 align-items:center;
}
.logo button{
 padding:6px 12px;
 font-size:12px;
 background:#333;
 color:#fff;
}
.code{
 background:#292929;
 padding:10px 15px;
 border-radius:10px;
 font-weight:bold
}
.screen{
 height:calc(100% - 65px);
 display:flex;
 position:relative;
 overflow:hidden;
}
.login{
 width:100%;
 height:100%;
 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:center;
 gap:15px
}
.login h1{
 font-size:35px;
 margin:0
}
.login input{
 width:280px;
 padding:14px;
 border:0;
 border-radius:10px;
 background:#292929;
 color:white;
 outline:none
}
button{
 border:0;
 border-radius:10px;
 padding:13px 20px;
 cursor:pointer;
 background:#fff;
 color:#111;
 font-weight:bold
}
button:hover{opacity:.85}
.main-chat-area{
 display:none;
 width:100%;
 height:100%;
 display:flex;
}
.chat-container{
 flex:1;
 height:100%;
 display:flex;
 flex-direction:column
}
.sidebar{
 width:260px;
 background:#1c1c1c;
 border-left:1px solid #333;
 display:flex;
 flex-direction:column;
 padding:15px;
 gap:15px;
 overflow-y:auto;
}
.sidebar h3{margin:0 0 5px 0; font-size:14px; opacity:.8;}
.user-list{
 display:flex;
 flex-direction:column;
 gap:6px;
 font-size:13px;
}
.user-item{
 background:#262626;
 padding:8px 10px;
 border-radius:8px;
 display:flex;
 align-items:center;
 gap:8px;
}
.dot{width:8px; height:8px; background:#2ecc71; border-radius:50%;}
.game-box{
 background:#222;
 padding:12px;
 border-radius:10px;
 border:1px solid #333;
 font-size:13px;
 text-align:center;
}
.game-box input{
 width:100%;
 padding:8px;
 margin:8px 0;
 background:#111;
 border:1px solid #444;
 color:white;
 border-radius:6px;
 text-align:center;
}
.messages{
 flex:1;
 overflow-y:auto;
 padding:20px
}
.msg{
 background:#292929;
 padding:10px 14px;
 border-radius:12px;
 margin-bottom:10px;
 max-width:75%;
 word-wrap:break-word
}
.me{
 margin-left:auto;
 background:#3a506b
}
.name{
 font-size:11px;
 opacity:.6;
 margin-bottom:4px;
 font-weight:bold;
}
.msg img{
 max-width:280px;
 border-radius:10px;
 display:block;
 margin-top:6px
}
.file-card{
 background:#1b1b1b;
 padding:10px;
 border-radius:8px;
 margin-top:6px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
 border:1px solid #333;
}
.file-card a{
 color:#3498db;
 text-decoration:none;
 font-weight:bold;
 font-size:13px;
}
.bottom{
 display:flex;
 gap:8px;
 padding:12px;
 background:#202020
}
.bottom input[type="text"]{
 flex:1;
 background:#292929;
 color:white;
 border:0;
 outline:none;
 border-radius:10px;
 padding:13px
}
.file-btn{
 width:45px;
 background:#292929;
 border-radius:10px;
 display:flex;
 justify-content:center;
 align-items:center;
 cursor:pointer;
 font-size:20px
}
#anyFile, #photoInput{display:none}
.status{
 font-size:12px;
 opacity:.6
}
</style>
</head>

<body>

<div class="app">

<div class="top">
<div class="logo">
  <span>XD Social Pro</span>
  <button onclick="leaveRoom()" id="leaveBtn" style="display:none;">Salir</button>
</div>
<div class="code" id="roomLabel">Sin sala</div>
</div>

<div class="screen">

<!-- LOGIN SCREEN -->
<div class="login" id="login">
<h1>XD Social Pro</h1>
<div class="status">Salas P2P con Archivos y Juegos</div>
<input id="nameInput" placeholder="Tu apodo">
<input id="roomInput" placeholder="Código: XD-423" maxlength="6">
<div>
<button onclick="createRoom()">Crear sala</button>
<button onclick="joinRoom()">Entrar a sala</button>
</div>
</div>

<!-- CHAT & APP SCREEN -->
<div class="main-chat-area" id="mainChatArea" style="display:none;">
<div class="chat-container">
<div class="messages" id="messages"></div>
<div class="bottom">
<label class="file-btn" title="Enviar Foto">
📷
<input type="file" id="photoInput" accept="image/*">
</label>
<label class="file-btn" title="Enviar Archivo (PDF, ZIP, etc.)">
📎
<input type="file" id="anyFile">
</label>
<input id="textInput" placeholder="Escribe un mensaje...">
<button onclick="sendMessage()">➤</button>
</div>
</div>

<!-- SIDEBAR: USERS & MINI-GAME -->
<div class="sidebar">
<div>
  <h3>Conectados (<span id="userCount">0</span>)</h3>
  <div class="user-list" id="userList"></div>
</div>

<div class="game-box">
  <h3>🎮 Minijuego</h3>
  <p style="font-size:11px; opacity:0.7; margin:5px 0;">Adivina el número secreto (1 al 50)</p>
  <input type="number" id="guessInput" placeholder="Tu número">
  <button onclick="sendGuess()" style="width:100%; padding:8px; font-size:12px; background:#e67e22; color:white;">Probar suerte</button>
</div>
</div>
</div>

</div>
</div>

<!-- Firebase SDKs -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, addDoc, doc, setDoc, deleteDoc, query, orderBy, onSnapshot, serverTimestamp, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAcmL4yVG6nlo8An8hbbTGoPfwVfp8yc_I",
  authDomain: "redsocialxd-a8d91.firebaseapp.com",
  projectId: "redsocialxd-a8d91",
  storageBucket: "redsocialxd-a8d91.firebasestorage.app",
  messagingSenderId: "469773176785",
  appId: "1:469773176785:web:8d080a707d4b4ebcb99af0",
  measurementId: "G-DKLKXRVTTF"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let currentRoom = "";
let myName = "";
let myId = "user_" + Math.random().toString(36).substring(2, 9);
let unsubMessages = null;
let unsubUsers = null;
let secretNum = Math.floor(Math.random() * 50) + 1;

const $ = id => document.getElementById(id);

function randomCode() {
  const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  return letters[Math.floor(Math.random() * 26)] + letters[Math.floor(Math.random() * 26)] + "-" + Math.floor(100 + Math.random() * 900);
}

window.createRoom = function() {
  myName = $("nameInput").value.trim() || "Anónimo";
  currentRoom = randomCode();
  startApp();
};

window.joinRoom = function() {
  myName = $("nameInput").value.trim() || "Anónimo";
  let code = $("roomInput").value.trim().toUpperCase();
  if (!/^[A-Z]{2}-[0-9]{3}$/.test(code)) {
    alert("El código debe ser formato tipo XD-423");
    return;
  }
  currentRoom = code;
  startApp();
};

async function startApp() {
  $("roomLabel").textContent = currentRoom;
  $("login").style.display = "none";
  $("mainChatArea").style.display = "flex";
  $("leaveBtn").style.display = "block";

  // Registrar presencia de usuario
  await setDoc(doc(db, "rooms", currentRoom, "users", myId), { name: myName, active: true });

  // Escuchar mensajes
  const qMsg = query(collection(db, "rooms", currentRoom, "messages"), orderBy("timestamp", "asc"));
  unsubMessages = onSnapshot(qMsg, (snapshot) => {
    snapshot.docChanges().forEach((change) => {
      if (change.type === "added") {
        renderMessage(change.doc.data());
      }
    });
  });

  // Escuchar usuarios conectados
  const qUsr = collection(db, "rooms", currentRoom, "users");
  unsubUsers = onSnapshot(qUsr, (snapshot) => {
    let usersHTML = "";
    let count = 0;
    snapshot.forEach((docSnap) => {
      let u = docSnap.data();
      count++;
      usersHTML += `<div class="user-item"><div class="dot"></div><span>${escapeHTML(u.name)}</span></div>`;
    });
    $("userList").innerHTML = usersHTML;
    $("userCount").textContent = count;
  });

  addSystemMsg("Te has unido a la sala: " + currentRoom);
}

window.sendMessage = async function() {
  let txt = $("textInput").value.trim();
  if(!txt) return;

  await addDoc(collection(db, "rooms", currentRoom, "messages"), {
    type: "text",
    name: myName,
    text: txt,
    timestamp: serverTimestamp()
  });
  $("textInput").value = "";
};

$("textInput").addEventListener("keydown", e => {
  if (e.key === "Enter") window.sendMessage();
});

// Enviar Foto
$("photoInput").addEventListener("change", async e => {
  let file = e.target.files[0];
  if(!file) return;
  if(file.size > 900 * 1024) { alert("La foto pesa más de 900KB. Elige una más ligera."); return; }

  let reader = new FileReader();
  reader.onload = async () => {
    await addDoc(collection(db, "rooms", currentRoom, "messages"), {
      type: "image",
      name: myName,
      data: reader.result,
      timestamp: serverTimestamp()
    });
  };
  reader.readAsDataURL(file);
  e.target.value = "";
});

// Enviar cualquier archivo (PDF, DOCX, ZIP, etc.)
$("anyFile").addEventListener("change", async e => {
  let file = e.target.files[0];
  if(!file) return;
  if(file.size > 900 * 1024) { alert("El archivo pesa más de 900KB. Límite ideal para Firestore."); return; }

  let reader = new FileReader();
  reader.onload = async () => {
    await addDoc(collection(db, "rooms", currentRoom, "messages"), {
      type: "file",
      name: myName,
      fileName: file.name,
      fileData: reader.result,
      timestamp: serverTimestamp()
    });
  };
  reader.readAsDataURL(file);
  e.target.value = "";
});

// Lógica del Minijuego
window.sendGuess = async function() {
  let val = parseInt($("guessInput").value);
  if(isNaN(val)) return;

  let hint = "";
  if(val === secretNum) {
    hint = `🎉 ¡${myName} adivino el número secreto (${secretNum})! Se reinicia el juego.`;
    secretNum = Math.floor(Math.random() * 50) + 1; // Nuevo número
  } else if(val < secretNum) {
    hint = `🎮 ${myName} probó con ${val}: El número es MAYOR ⬆️`;
  } else {
    hint = `🎮 ${myName} probó con ${val}: El número es MENOR ⬇️`;
  }

  await addDoc(collection(db, "rooms", currentRoom, "messages"), {
    type: "system",
    text: hint,
    timestamp: serverTimestamp()
  });
  $("guessInput").value = "";
};

function renderMessage(data) {
  let box = document.createElement("div");
  let isMe = (data.name === myName);

  if (data.type === "system") {
    box.style.textAlign = "center";
    box.style.opacity = ".7";
    box.style.fontSize = "12px";
    box.style.margin = "8px 0";
    box.style.color = "#f1c40f";
    box.textContent = data.text;
    $("messages").appendChild(box);
    $("messages").scrollTop = $("messages").scrollHeight;
    return;
  }

  box.className = "msg" + (isMe && data.name ? " me" : "");
  
  let nameDiv = document.createElement("div");
  nameDiv.className = "name";
  nameDiv.textContent = data.name || "Anónimo";
  box.appendChild(nameDiv);

  if (data.type === "image") {
    let img = document.createElement("img");
    img.src = data.data;
    box.appendChild(img);
  } else if (data.type === "file") {
    let card = document.createElement("div");
    card.className = "file-card";
    card.innerHTML = `<span>📁 ${escapeHTML(data.fileName)}</span> <a href="${data.fileData}" download="${escapeHTML(data.fileName)}">Descargar</a>`;
    box.appendChild(card);
  } else {
    let txt = document.createTextNode(data.text || "");
    box.appendChild(txt);
  }

  $("messages").appendChild(box);
  $("messages").scrollTop = $("messages").scrollHeight;
}

function addSystemMsg(text) {
  let box = document.createElement("div");
  box.style.textAlign = "center";
  box.style.opacity = ".6";
  box.style.fontSize = "12px";
  box.style.margin = "10px";
  box.textContent = text;
  $("messages").appendChild(box);
  $("messages").scrollTop = $("messages").scrollHeight;
}

window.leaveRoom = async function() {
  try {
    await deleteDoc(doc(db, "rooms", currentRoom, "users", myId));
  } catch(e) {}
  location.reload();
};

function escapeHTML(text) {
  return text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
</script>

</body>
</html>
