<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XD Social P2P</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#111;
 color:white;
 height:100vh;
 display:flex;
 justify-content:center;
 align-items:center
}
.app{
 width:95%;
 max-width:900px;
 height:90vh;
 background:#181818;
 border-radius:18px;
 overflow:hidden;
 box-shadow:0 0 30px #000
}
.top{
 height:65px;
 background:#202020;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 20px;
 border-bottom:1px solid #333
}
.logo{
 font-size:22px;
 font-weight:bold
}
.code{
 background:#292929;
 padding:10px 15px;
 border-radius:10px;
 font-weight:bold
}
.screen{
 height:calc(100% - 65px);
 display:flex
}
.login{
 width:100%;
 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:center;
 gap:15px
}
.login h1{
 font-size:35px;
 margin:0
}
.login input{
 width:280px;
 padding:14px;
 border:0;
 border-radius:10px;
 background:#292929;
 color:white;
 outline:none
}
button{
 border:0;
 border-radius:10px;
 padding:13px 20px;
 cursor:pointer;
 background:#fff;
 color:#111;
 font-weight:bold
}
button:hover{opacity:.85}
.chat{
 width:100%;
 display:none;
 flex-direction:column
}
.messages{
 flex:1;
 overflow-y:auto;
 padding:20px
}
.msg{
 background:#292929;
 padding:10px 14px;
 border-radius:12px;
 margin-bottom:10px;
 max-width:75%;
 word-wrap:break-word
}
.me{
 margin-left:auto;
 background:#444
}
.name{
 font-size:11px;
 opacity:.6;
 margin-bottom:4px
}
.msg img{
 max-width:300px;
 border-radius:10px;
 display:block;
 margin-top:6px
}
.bottom{
 display:flex;
 gap:8px;
 padding:12px;
 background:#202020
}
.bottom input{
 flex:1;
 background:#292929;
 color:white;
 border:0;
 outline:none;
 border-radius:10px;
 padding:13px
}
.file{
 width:45px;
 display:flex;
 justify-content:center;
 align-items:center;
 cursor:pointer;
 font-size:22px
}
#photo{display:none}
.users{
 position:absolute;
 right:15px;
 top:80px;
 background:#202020;
 border-radius:10px;
 padding:10px;
 font-size:12px;
 display:none
}
.status{
 font-size:12px;
 opacity:.6
}
</style>
</head>

<body>

<div class="app">

<div class="top">
<div class="logo">XD Social</div>
<div class="code" id="roomLabel">Sin sala</div>
</div>

<div class="screen">

<div class="login" id="login">

<h1>XD Social</h1>

<div class="status" id="status">
Red social P2P
</div>

<input id="name" placeholder="Tu nombre">

<input id="room" placeholder="Código: XD-423" maxlength="6">

<div>
<button onclick="createRoom()">Crear sala</button>
<button onclick="joinRoom()">Entrar</button>
</div>

</div>

<div class="chat" id="chat">

<div class="messages" id="messages"></div>

<div class="bottom">

<label class="file">
📷
<input type="file" id="photo" accept="image/*">
</label>

<input id="text" placeholder="Escribe un mensaje...">

<button onclick="sendMessage()">➤</button>

</div>

</div>

</div>
</div>

<script>

let peer;
let connections=[];
let host=false;
let roomCode="";
let myName="";

const $=id=>document.getElementById(id);

function randomCode(){

 const letters="ABCDEFGHIJKLMNOPQRSTUVWXYZ";

 let a=letters[Math.floor(Math.random()*26)];
 let b=letters[Math.floor(Math.random()*26)];

 let n=Math.floor(100+Math.random()*900);

 return a+b+"-"+n;

}

function createRoom(){

 myName=$("name").value.trim() || "Anónimo";

 roomCode=randomCode();

 host=true;

 startPeer(roomCode);

}

function joinRoom(){

 myName=$("name").value.trim() || "Anónimo";

 let code=$("room").value
 .trim()
 .toUpperCase();

 if(!/^[A-Z]{2}-[0-9]{3}$/.test(code)){

   alert("El código debe ser como XD-423");

   return;

 }

 roomCode=code;

 host=false;

 startPeer("user-"+Math.random().toString(36).slice(2));

}

function startPeer(id){

 $("status").textContent="Conectando...";

 peer=new Peer(id);

 peer.on("open",()=>{

   if(host){

     $("roomLabel").textContent=roomCode;

     openChat();

     addSystem("Sala creada. Comparte el código: "+roomCode);

   }else{

     $("roomLabel").textContent=roomCode;

     openChat();

     connectToHost();

   }

 });

 peer.on("connection",conn=>{

   if(host){

     setupConnection(conn);

   }

 });

 peer.on("error",err=>{

   console.log(err);

   $("status").textContent="Error de conexión";

   alert("No se pudo conectar: "+err.type);

 });

}

function connectToHost(){

 let conn=peer.connect(roomCode,{
   reliable:true
 });

 setupConnection(conn);

}

function setupConnection(conn){

 conn.on("open",()=>{

   connections.push(conn);

   conn.send({
     type:"hello",
     name:myName
   });

   if(host){

     broadcast({
       type:"system",
       text:myName+" entró a la sala"
     },conn);

   }

 });

 conn.on("data",data=>{

   receiveData(data,conn);

 });

 conn.on("close",()=>{

   connections=connections.filter(c=>c!==conn);

 });

}

function receiveData(data,conn){

 if(data.type==="hello"){

   addSystem(data.name+" se conectó");

   if(host){

     broadcast(data,conn);

   }

   return;

 }

 if(data.type==="message"){

   addMessage(data.name,data.text,false);

   if(host){

     broadcast(data,conn);

   }

   return;

 }

 if(data.type==="image"){

   addImage(data.name,data.data,false);

   if(host){

     broadcast(data,conn);

   }

   return;

 }

 if(data.type==="system"){

   addSystem(data.text);

   if(host){

     broadcast(data,conn);

   }

 }

}

function broadcast(data,except=null){

 connections.forEach(c=>{

   if(c!==except && c.open){

     c.send(data);

   }

 });

}

function sendMessage(){

 let input=$("text");

 let text=input.value.trim();

 if(!text)return;

 let data={
   type:"message",
   name:myName,
   text:text
 };

 addMessage(myName,text,true);

 if(host){

   broadcast(data);

 }else{

   connections.forEach(c=>{

     if(c.open)c.send(data);

   });

 }

 input.value="";

}

$("text").addEventListener("keydown",e=>{

 if(e.key==="Enter")sendMessage();

});

$("photo").addEventListener("change",async e=>{

 let file=e.target.files[0];

 if(!file)return;

 if(file.size>5*1024*1024){

   alert("La foto debe pesar menos de 5 MB");

   return;

 }

 let reader=new FileReader();

 reader.onload=()=>{

   let data={
     type:"image",
     name:myName,
     data:reader.result
   };

   addImage(myName,reader.result,true);

   if(host){

     broadcast(data);

   }else{

     connections.forEach(c=>{

       if(c.open)c.send(data);

     });

   }

 };

 reader.readAsDataURL(file);

 e.target.value="";

});

function addMessage(name,text,me){

 let box=document.createElement("div");

 box.className="msg"+(me?" me":"");

 box.innerHTML=
   '<div class="name">'+escapeHTML(name)+'</div>'+
   escapeHTML(text);

 $("messages").appendChild(box);

 scroll();

}

function addImage(name,data,me){

 let box=document.createElement("div");

 box.className="msg"+(me?" me":"");

 let n=document.createElement("div");

 n.className="name";

 n.textContent=name;

 let img=document.createElement("img");

 img.src=data;

 box.appendChild(n);

 box.appendChild(img);

 $("messages").appendChild(box);

 scroll();

}

function addSystem(text){

 let box=document.createElement("div");

 box.style.textAlign="center";
 box.style.opacity=".6";
 box.style.fontSize="12px";
 box.style.margin="10px";

 box.textContent=text;

 $("messages").appendChild(box);

 scroll();

}

function scroll(){

 $("messages").scrollTop=$("messages").scrollHeight;

}

function escapeHTML(text){

 return text
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;");

}

function openChat(){

 $("login").style.display="none";

 $("chat").style.display="flex";

}

</script>

</body>
</html>
