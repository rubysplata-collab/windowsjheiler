<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>BLOXVERSE</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:100%;height:100%;overflow:hidden;font-family:'Segoe UI',Arial,sans-serif;background:#0a0e1a;}
  #app{position:relative;width:100vw;height:100vh;}
  .screen{position:absolute;top:0;left:0;width:100%;height:100%;display:none;}
  .screen.active{display:flex;}

  /* LOGIN */
  #loginScreen{background:linear-gradient(135deg,#1a1f3a 0%,#0a0e1a 100%);align-items:center;justify-content:center;flex-direction:column;}
  .logo{font-size:52px;font-weight:900;color:#00d9ff;letter-spacing:4px;text-shadow:0 0 30px #00d9ff88;margin-bottom:6px;}
  .logo span{color:#ff3d7f;}
  .tagline{color:#8890b0;font-size:14px;margin-bottom:40px;letter-spacing:2px;}
  .loginCard{background:#151a30;border:1px solid #2a3358;border-radius:16px;padding:36px 40px;width:340px;box-shadow:0 20px 60px rgba(0,0,0,0.5);}
  .loginCard h2{color:#fff;font-size:20px;margin-bottom:20px;text-align:center;}
  .loginCard input{width:100%;padding:14px;background:#0d1122;border:1px solid #2a3358;border-radius:10px;color:#fff;font-size:15px;margin-bottom:14px;outline:none;transition:border 0.2s;}
  .loginCard input:focus{border-color:#00d9ff;}
  .loginCard input::placeholder{color:#5a6288;}
  .playBtn{width:100%;padding:14px;background:linear-gradient(90deg,#00d9ff,#00a8ff);border:none;border-radius:10px;color:#001420;font-weight:700;font-size:16px;cursor:pointer;letter-spacing:1px;transition:transform 0.15s;}
  .playBtn:hover{transform:scale(1.02);}
  .playBtn:active{transform:scale(0.98);}
  .errMsg{color:#ff5577;font-size:13px;text-align:center;margin-top:10px;height:16px;}
  .loadingText{color:#00d9ff;font-size:13px;text-align:center;margin-top:10px;height:16px;}

  /* LOBBY */
  #lobbyScreen{background:linear-gradient(180deg,#0a0e1a 0%,#141a30 100%);flex-direction:column;}
  #topbar{display:flex;justify-content:space-between;align-items:center;padding:18px 32px;background:rgba(10,14,26,0.8);border-bottom:1px solid #2a3358;}
  #topbar .logo{font-size:24px;margin:0;}
  #userBadge{display:flex;align-items:center;gap:10px;color:#c8ceec;font-size:14px;}
  #avatarCircle{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#00d9ff,#ff3d7f);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:14px;}
  #gameGrid{flex:1;padding:40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px;max-width:1000px;margin:0 auto;width:100%;overflow-y:auto;align-content:start;}
  .gameCard{background:#151a30;border:1px solid #2a3358;border-radius:16px;overflow:hidden;cursor:pointer;transition:transform 0.2s, border-color 0.2s;}
  .gameCard:hover{transform:translateY(-6px);border-color:#00d9ff;}
  .cardThumb{height:150px;display:flex;align-items:center;justify-content:center;font-size:52px;}
  .cardBody{padding:16px 18px;}
  .cardBody h3{color:#fff;font-size:17px;margin-bottom:6px;}
  .cardBody p{color:#8890b0;font-size:13px;line-height:1.5;}
  .cardTag{display:inline-block;margin-top:10px;padding:4px 10px;background:#00d9ff22;color:#00d9ff;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:1px;}

  /* GAME */
  #gameScreen{background:#87ceeb;flex-direction:column;}
  #gameCanvasWrap{flex:1;position:relative;}
  canvas{display:block;width:100%;height:100%;}
  #gameHud{position:absolute;top:0;left:0;width:100%;padding:16px 24px;display:flex;justify-content:space-between;pointer-events:none;}
  .hudPill{background:rgba(10,14,26,0.75);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;font-weight:600;border:1px solid #2a3358;}
  #backBtn{position:absolute;top:16px;right:24px;pointer-events:all;background:rgba(10,14,26,0.75);color:#fff;border:1px solid #2a3358;padding:10px 18px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;}
  #backBtn:hover{background:#ff3d7f33;border-color:#ff3d7f;}
  #centerMsg{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);text-align:center;color:#fff;pointer-events:none;text-shadow:0 2px 10px rgba(0,0,0,0.6);}
  #centerMsg h1{font-size:42px;margin-bottom:8px;}
  #centerMsg p{font-size:16px;opacity:0.9;}
  #mobileControls{position:absolute;bottom:24px;left:0;width:100%;display:none;justify-content:space-between;padding:0 24px;pointer-events:none;}
  .padBtn{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,0.25);border:2px solid rgba(255,255,255,0.5);pointer-events:all;font-size:22px;color:#fff;display:flex;align-items:center;justify-content:center;user-select:none;}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module">

import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDAT9zIGnt97ojeL7TA6IRH489rERDVMgI",
  authDomain: "siano-4d901.firebaseapp.com",
  projectId: "siano-4d901",
  storageBucket: "siano-4d901.firebasestorage.app",
  messagingSenderId: "224378787783",
  appId: "1:224378787783:web:8cf1ef2409e955e0a62be2",
  measurementId: "G-8C4QPQRW6H"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let currentUsername = null;

const errMsg = document.getElementById('errMsg');
const loadingText = document.getElementById('loadingText');
const enterBtn = document.getElementById('enterBtn');
const usernameInput = document.getElementById('usernameInput');

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

enterBtn.addEventListener('click', async ()=>{
  const name = usernameInput.value.trim();
  errMsg.textContent = '';
  if(name.length < 3){
    errMsg.textContent = 'El nombre debe tener al menos 3 caracteres.';
    return;
  }
  if(!/^[a-zA-Z0-9_]+$/.test(name)){
    errMsg.textContent = 'Solo letras, números y guion bajo.';
    return;
  }
  enterBtn.disabled = true;
  loadingText.textContent = 'Conectando...';
  try{
    const cred = await signInAnonymously(auth);
    currentUser = cred.user;
    currentUsername = name;
    await setDoc(doc(db, 'players', currentUser.uid), {
      username: name,
      lastLogin: Date.now()
    }, { merge: true });
    loadingText.textContent = '';
    enterLobby(name);
  }catch(e){
    console.error(e);
    errMsg.textContent = 'Error al conectar. Intenta de nuevo.';
    loadingText.textContent = '';
    enterBtn.disabled = false;
  }
});

usernameInput.addEventListener('keydown', e=>{
  if(e.key === 'Enter') enterBtn.click();
});

function enterLobby(name){
  document.getElementById('usernameDisplay').textContent = name;
  document.getElementById('avatarCircle').textContent = name[0].toUpperCase();
  showScreen('lobbyScreen');
  buildGameGrid();
}

const GAMES = [
  {id:'parkour', icon:'🏔️', title:'Parkour Tower', desc:'Sube la torre saltando plataformas sin caer al vacío.', color:'linear-gradient(135deg,#ff6b6b,#ffa500)'},
  {id:'coins', icon:'🪙', title:'Coin Rush', desc:'Recolecta todas las monedas del mapa antes de que se acabe el tiempo.', color:'linear-gradient(135deg,#ffd700,#ff8c00)'},
  {id:'obby', icon:'⚡', title:'Obby Runner', desc:'Esquiva obstáculos giratorios y llega a la meta sin ser golpeado.', color:'linear-gradient(135deg,#00d9ff,#6a5cff)'}
];

function buildGameGrid(){
  const grid = document.getElementById('gameGrid');
  grid.innerHTML = '';
  GAMES.forEach(g=>{
    const card = document.createElement('div');
    card.className = 'gameCard';
    card.innerHTML = `
      <div class="cardThumb" style="background:${g.color}">${g.icon}</div>
      <div class="cardBody">
        <h3>${g.title}</h3>
        <p>${g.desc}</p>
        <span class="cardTag">JUGAR AHORA</span>
      </div>`;
    card.onclick = ()=> launchGame(g.id);
    grid.appendChild(card);
  });
}

document.getElementById('backBtn').addEventListener('click', ()=>{
  stopGame();
  showScreen('lobbyScreen');
});

// ============ THREE.JS GAME ENGINE ============
let scene, camera, renderer, clock;
let animId = null;
let currentGameId = null;
let keys = {};
let mobileMove = {left:false, right:false, jump:false};

const canvas = document.getElementById('c');

function initEngine(){
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87ceeb);
  scene.fog = new THREE.Fog(0x87ceeb, 30, 90);

  camera = new THREE.PerspectiveCamera(65, canvas.clientWidth/canvas.clientHeight, 0.1, 500);

  renderer = new THREE.WebGLRenderer({canvas, antialias:true});
  renderer.setSize(canvas.clientWidth, canvas.clientHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const hemi = new THREE.HemisphereLight(0xffffff, 0x444466, 0.9);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xffffff, 1.1);
  sun.position.set(30,50,20);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048,2048);
  sun.shadow.camera.left = -50;
  sun.shadow.camera.right = 50;
  sun.shadow.camera.top = 50;
  sun.shadow.camera.bottom = -50;
  scene.add(sun);

  clock = new THREE.Clock();
}

function clearScene(){
  if(!scene) return;
  while(scene.children.length>0) scene.remove(scene.children[0]);
}

window.addEventListener('resize', ()=>{
  if(!renderer) return;
  camera.aspect = canvas.clientWidth/canvas.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(canvas.clientWidth, canvas.clientHeight);
});

document.addEventListener('keydown', e=> keys[e.key.toLowerCase()]=true);
document.addEventListener('keyup', e=> keys[e.key.toLowerCase()]=false);

function bindMobile(){
  const bl = document.getElementById('btnLeft');
  const br = document.getElementById('btnRight');
  const bj = document.getElementById('btnJump');
  const set = (el, key, val)=>{
    ['touchstart','mousedown'].forEach(ev=>el.addEventListener(ev, e=>{e.preventDefault(); mobileMove[key]=val;}));
    ['touchend','mouseup','mouseleave'].forEach(ev=>el.addEventListener(ev, e=>{e.preventDefault(); mobileMove[key]=false;}));
  };
  set(bl,'left',true); set(br,'right',true); set(bj,'jump',true);
  document.getElementById('mobileControls').style.display = ('ontouchstart' in window) ? 'flex' : 'none';
}
bindMobile();

// ---- Humanoid character builder ----
function buildCharacter(color=0x00a8ff){
  const group = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({color, roughness:0.6});
  const skinMat = new THREE.MeshStandardMaterial({color:0xffcc99, roughness:0.7});

  const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.32,0.55,4,8), mat);
  torso.position.y = 1.0;
  torso.castShadow = true;
  group.add(torso);

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.28,16,16), skinMat);
  head.position.y = 1.65;
  head.castShadow = true;
  group.add(head);

  function limb(x, isArm){
    const geo = isArm ? new THREE.CapsuleGeometry(0.09,0.5,4,8) : new THREE.CapsuleGeometry(0.11,0.55,4,8);
    const m = new THREE.Mesh(geo, isArm?mat:new THREE.MeshStandardMaterial({color:0x2b2b40,roughness:0.6}));
    m.position.set(x, isArm?1.15:0.4, 0);
    m.castShadow = true;
    const pivot = new THREE.Group();
    pivot.position.set(x, isArm?1.4:0.65,0);
    m.position.set(0, isArm?-0.28:-0.28, 0);
    pivot.add(m);
    return pivot;
  }
  const armL = limb(-0.42, true);
  const armR = limb(0.42, true);
  const legL = limb(-0.15, false);
  const legR = limb(0.15, false);
  group.add(armL, armR, legL, legR);

  group.userData.limbs = {armL, armR, legL, legR};
  group.userData.walkT = 0;
  return group;
}

function animateWalk(char, speed, dt){
  const {armL,armR,legL,legR} = char.userData.limbs;
  char.userData.walkT += dt * 8 * Math.min(speed,1.5);
  const t = char.userData.walkT;
  const amp = Math.min(speed,1)*0.6;
  armL.rotation.x = Math.sin(t)*amp;
  armR.rotation.x = -Math.sin(t)*amp;
  legL.rotation.x = -Math.sin(t)*amp;
  legR.rotation.x = Math.sin(t)*amp;
  if(speed<0.05){
    armL.rotation.x *= 0.9; armR.rotation.x *= 0.9;
    legL.rotation.x *= 0.9; legR.rotation.x *= 0.9;
  }
}

function stopGame(){
  if(animId) cancelAnimationFrame(animId);
  animId = null;
  currentGameId = null;
  clearScene();
}

function launchGame(id){
  currentGameId = id;
  showScreen('gameScreen');
  if(!renderer) initEngine();
  clearScene();
  const sun = new THREE.DirectionalLight(0xffffff,1.1);
  sun.position.set(30,50,20); sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048);
  sun.shadow.camera.left=-50; sun.shadow.camera.right=50; sun.shadow.camera.top=50; sun.shadow.camera.bottom=-50;
  scene.add(sun);
  scene.add(new THREE.HemisphereLight(0xffffff,0x444466,0.9));

  document.getElementById('centerMsg').innerHTML = '';
  if(id==='parkour') setupParkour();
  else if(id==='coins') setupCoins();
  else if(id==='obby') setupObby();
}

// ================= GAME 1: PARKOUR TOWER =================
function setupParkour(){
  scene.background = new THREE.Color(0x9fd8ff);
  scene.fog = new THREE.Fog(0x9fd8ff, 40, 120);

  const platforms = [];
  const platMat = new THREE.MeshStandardMaterial({color:0xff8c42, roughness:0.7});
  const groundGeo = new THREE.BoxGeometry(8,1,8);
  let y = 0;
  for(let i=0;i<14;i++){
    const w = 3.2 - i*0.08;
    const p = new THREE.Mesh(new THREE.BoxGeometry(Math.max(w,1.6),0.6,Math.max(w,1.6)), i%2===0?platMat:new THREE.MeshStandardMaterial({color:0x42a5ff,roughness:0.7}));
    const angle = i*0.9;
    p.position.set(Math.sin(angle)*3.5, y, Math.cos(angle)*3.5 - 6);
    p.receiveShadow = true; p.castShadow = true;
    scene.add(p);
    platforms.push(p);
    y += 1.6;
  }
  const goalPlat = platforms[platforms.length-1];
  const flag = new THREE.Mesh(new THREE.ConeGeometry(0.4,1.2,6), new THREE.MeshStandardMaterial({color:0xffd700}));
  flag.position.copy(goalPlat.position);
  flag.position.y += 1;
  scene.add(flag);

  const player = buildCharacter(0x00d9ff);
  player.position.set(platforms[0].position.x, platforms[0].position.y+1, platforms[0].position.z);
  scene.add(player);

  const vel = {y:0};
  let grounded = true;
  let score = 0;
  let won = false;
  const startTime = performance.now();

  document.getElementById('hudLeft').textContent = 'Altura: 0m';
  document.getElementById('hudRight').textContent = '00:00';

  function jump(){
    if(grounded){ vel.y = 0.22; grounded = false; }
  }
  const jumpHandler = e=>{ if(e.key===' ') jump(); };
  document.addEventListener('keydown', jumpHandler);

  function frame(){
    const dt = clock.getDelta();
    let moveX=0, moveZ=0;
    if(keys['w']||keys['arrowup']) moveZ -= 1;
    if(keys['s']||keys['arrowdown']) moveZ += 1;
    if(keys['a']||keys['arrowleft']||mobileMove.left) moveX -= 1;
    if(keys['d']||keys['arrowright']||mobileMove.right) moveX += 1;
    if(mobileMove.jump) jump();

    const len = Math.hypot(moveX,moveZ);
    const speed = len>0 ? 1 : 0;
    if(len>0){ moveX/=len; moveZ/=len; }

    player.position.x += moveX*0.08;
    player.position.z += moveZ*0.08;
    if(len>0.1) player.rotation.y = Math.atan2(moveX, moveZ);
    animateWalk(player, speed, dt);

    vel.y -= 0.012;
    player.position.y += vel.y;

    grounded = false;
    for(const p of platforms){
      const dx = Math.abs(player.position.x - p.position.x);
      const dz = Math.abs(player.position.z - p.position.z);
      const halfW = p.geometry.parameters.width/2;
      if(dx < halfW+0.3 && dz < halfW+0.3){
        const topY = p.position.y + p.geometry.parameters.height/2;
        if(player.position.y <= topY+1.0 && player.position.y >= topY - 0.3 && vel.y<=0){
          player.position.y = topY+1;
          vel.y = 0;
          grounded = true;
        }
      }
    }

    const heightM = Math.max(0, Math.round((player.position.y - 1)*2));
    document.getElementById('hudLeft').textContent = 'Altura: '+heightM+'m';
    const elapsed = Math.floor((performance.now()-startTime)/1000);
    document.getElementById('hudRight').textContent = String(Math.floor(elapsed/60)).padStart(2,'0')+':'+String(elapsed%60).padStart(2,'0');

    if(player.position.y < -10 && !won){
      document.getElementById('centerMsg').innerHTML = '<h1>¡CAÍSTE!</h1><p>Presiona para reintentar</p>';
      setTimeout(()=>{ launchGame('parkour'); }, 1500);
      document.removeEventListener('keydown', jumpHandler);
      return;
    }

    const distToGoal = player.position.distanceTo(new THREE.Vector3(goalPlat.position.x, player.position.y, goalPlat.position.z));
    if(distToGoal < 1.2 && !won){
      won = true;
      document.getElementById('centerMsg').innerHTML = '<h1>🏆 ¡LLEGASTE A LA CIMA!</h1><p>Volviendo al lobby...</p>';
      setTimeout(()=>{ stopGame(); showScreen('lobbyScreen'); document.removeEventListener('keydown', jumpHandler); }, 2000);
    }

    const camOffset = new THREE.Vector3(0, 2.5, 6);
    const desiredCam = player.position.clone().add(camOffset);
    camera.position.lerp(desiredCam, 0.08);
    camera.lookAt(player.position.x, player.position.y+0.8, player.position.z);

    renderer.render(scene, camera);
    if(currentGameId==='parkour') animId = requestAnimationFrame(frame);
  }
  animId = requestAnimationFrame(frame);
}

// ================= GAME 2: COIN RUSH =================
function setupCoins(){
  scene.background = new THREE.Color(0x87ceeb);
  scene.fog = new THREE.Fog(0x87ceeb, 30, 90);

  const groundMat = new THREE.MeshStandardMaterial({color:0x5fbf5f, roughness:0.9});
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(60,60), groundMat);
  ground.rotation.x = -Math.PI/2;
  ground.receiveShadow = true;
  scene.add(ground);

  for(let i=0;i<10;i++){
    const t = new THREE.Mesh(new THREE.CylinderGeometry(0.6,0.8,1.5,8), new THREE.MeshStandardMaterial({color:0x8b5a2b}));
    t.position.set((Math.random()-0.5)*50,0.75,(Math.random()-0.5)*50);
    t.castShadow = true;
    scene.add(t);
  }

  const player = buildCharacter(0xff3d7f);
  player.position.set(0,1,0);
  scene.add(player);

  const coins = [];
  const coinGeo = new THREE.CylinderGeometry(0.4,0.4,0.12,16);
  const coinMat = new THREE.MeshStandardMaterial({color:0xffd700, metalness:0.6, roughness:0.3, emissive:0x554400});
  const total = 15;
  for(let i=0;i<total;i++){
    const c = new THREE.Mesh(coinGeo, coinMat);
    c.rotation.x = Math.PI/2;
    c.position.set((Math.random()-0.5)*45, 0.8, (Math.random()-0.5)*45);
    c.castShadow = true;
    scene.add(c);
    coins.push(c);
  }

  let score = 0;
  let timeLeft = 45;
  document.getElementById('hudLeft').textContent = 'Monedas: 0/'+total;
  document.getElementById('hudRight').textContent = timeLeft+'s';

  const timerInt = setInterval(()=>{
    if(currentGameId!=='coins'){ clearInterval(timerInt); return; }
    timeLeft--;
    document.getElementById('hudRight').textContent = Math.max(0,timeLeft)+'s';
    if(timeLeft<=0){
      clearInterval(timerInt);
      document.getElementById('centerMsg').innerHTML = '<h1>⏰ TIEMPO AGOTADO</h1><p>Conseguiste '+score+'/'+total+' monedas</p>';
      setTimeout(()=>{ stopGame(); showScreen('lobbyScreen'); }, 2200);
    }
  },1000);

  function frame(){
    const dt = clock.getDelta();
    let moveX=0, moveZ=0;
    if(keys['w']||keys['arrowup']) moveZ -= 1;
    if(keys['s']||keys['arrowdown']) moveZ += 1;
    if(keys['a']||keys['arrowleft']||mobileMove.left) moveX -= 1;
    if(keys['d']||keys['arrowright']||mobileMove.right) moveX += 1;

    const len = Math.hypot(moveX,moveZ);
    const speed = len>0?1:0;
    if(len>0){ moveX/=len; moveZ/=len; }
    player.position.x += moveX*0.15;
    player.position.z += moveZ*0.15;
    player.position.x = Math.max(-29,Math.min(29,player.position.x));
    player.position.z = Math.max(-29,Math.min(29,player.position.z));
    if(len>0.1) player.rotation.y = Math.atan2(moveX,moveZ);
    animateWalk(player, speed, dt);

    coins.forEach(c=>{ if(c.visible) c.rotation.z += dt*3; });

    coins.forEach(c=>{
      if(c.visible && player.position.distanceTo(c.position) < 1.1){
        c.visible = false;
        score++;
        document.getElementById('hudLeft').textContent = 'Monedas: '+score+'/'+total;
        if(score===total){
          clearInterval(timerInt);
          document.getElementById('centerMsg').innerHTML = '<h1>🎉 ¡RECOLECTASTE TODO!</h1><p>Volviendo al lobby...</p>';
          setTimeout(()=>{ stopGame(); showScreen('lobbyScreen'); }, 2000);
        }
      }
    });

    const camOffset = new THREE.Vector3(0, 5, 8);
    camera.position.lerp(player.position.clone().add(camOffset), 0.08);
    camera.lookAt(player.position);

    renderer.render(scene, camera);
    if(currentGameId==='coins') animId = requestAnimationFrame(frame);
  }
  animId = requestAnimationFrame(frame);
}

// ================= GAME 3: OBBY RUNNER =================
function setupObby(){
  scene.background = new THREE.Color(0x2b1a4a);
  scene.fog = new THREE.Fog(0x2b1a4a, 20, 70);

  const pathMat = new THREE.MeshStandardMaterial({color:0x6a5cff, roughness:0.6});
  const path = new THREE.Mesh(new THREE.BoxGeometry(6,0.5,80), pathMat);
  path.position.z = -35;
  path.receiveShadow = true;
  scene.add(path);

  const goal = new THREE.Mesh(new THREE.BoxGeometry(6,0.5,4), new THREE.MeshStandardMaterial({color:0x00ff88, emissive:0x004422}));
  goal.position.set(0,0,-73);
  scene.add(goal);

  const obstacles = [];
  for(let i=0;i<8;i++){
    const arm = new THREE.Mesh(new THREE.BoxGeometry(5,0.5,0.5), new THREE.MeshStandardMaterial({color:0xff3d7f}));
    const pivot = new THREE.Group();
    pivot.position.set(0, 0.6, -8 - i*8);
    arm.position.x = 2.5;
    pivot.add(arm);
    pivot.userData.speed = 0.8 + Math.random()*0.8;
    scene.add(pivot);
    obstacles.push(pivot);
  }

  const player = buildCharacter(0xffd700);
  player.position.set(0,1,0);
  scene.add(player);

  let hits = 0;
  let finished = false;
  const startTime = performance.now();
  document.getElementById('hudLeft').textContent = 'Golpes: 0';
  document.getElementById('hudRight').textContent = '00:00';

  function jump(){
    if(player.userData.grounded !== false){
      player.userData.vy = 0.2;
      player.userData.grounded = false;
    }
  }
  player.userData.vy = 0;
  player.userData.grounded = true;
  const jumpHandler = e=>{ if(e.key===' ') jump(); };
  document.addEventListener('keydown', jumpHandler);

  function frame(){
    const dt = clock.getDelta();
    let moveX=0;
    if(keys['a']||keys['arrowleft']||mobileMove.left) moveX -= 1;
    if(keys['d']||keys['arrowright']||mobileMove.right) moveX += 1;
    if(mobileMove.jump) jump();
    player.position.x += moveX*0.1;
    player.position.x = Math.max(-2.7,Math.min(2.7,player.position.x));
    player.position.z -= 0.09;
    if(moveX!==0) player.rotation.y = moveX>0?Math.PI/2:-Math.PI/2;
    else player.rotation.y = Math.PI;
    animateWalk(player, 1, dt);

    player.userData.vy -= 0.012;
    player.position.y += player.userData.vy;
    if(player.position.y<=1){ player.position.y=1; player.userData.vy=0; player.userData.grounded=true; }

    obstacles.forEach(o=>{
      o.rotation.y += dt*o.userData.speed;
      const armWorldPos = new THREE.Vector3();
      o.children[0].getWorldPosition(armWorldPos);
      if(Math.abs(player.position.z - o.position.z) < 0.6 && player.position.y < 1.3){
        const dx = player.position.x - o.position.x;
        const dz = player.position.z - o.position.z;
        const angle = Math.atan2(dz,dx) - o.rotation.y;
        const localX = Math.cos(o.rotation.y)*dx + Math.sin(o.rotation.y)*dz;
        if(Math.abs(localX)<2.7 && !o.userData.hitCooldown){
          hits++;
          o.userData.hitCooldown = true;
          setTimeout(()=>o.userData.hitCooldown=false, 800);
          document.getElementById('hudLeft').textContent = 'Golpes: '+hits;
          player.position.z += 1.5;
        }
      }
    });

    const elapsed = Math.floor((performance.now()-startTime)/1000);
    document.getElementById('hudRight').textContent = String(Math.floor(elapsed/60)).padStart(2,'0')+':'+String(elapsed%60).padStart(2,'0');

    if(player.position.z <= -73 && !finished){
      finished = true;
      document.getElementById('centerMsg').innerHTML = '<h1>🏁 ¡META!</h1><p>Golpes recibidos: '+hits+'</p>';
      document.removeEventListener('keydown', jumpHandler);
      setTimeout(()=>{ stopGame(); showScreen('lobbyScreen'); }, 2200);
    }

    const camOffset = new THREE.Vector3(0, 3.5, 6);
    camera.position.lerp(player.position.clone().add(camOffset), 0.1);
    camera.lookAt(player.position.x, player.position.y+0.5, player.position.z-3);

    renderer.render(scene, camera);
    if(currentGameId==='obby') animId = requestAnimationFrame(frame);
  }
  animId = requestAnimationFrame(frame);
}
