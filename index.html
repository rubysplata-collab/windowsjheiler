<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🚽 Skibidi Animator PRO</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: "Courier New", monospace; background: #0a0a0a; color: #0f0; overflow: hidden; }

.container { display: flex; height: 100vh; }

.sidebar {
  width: 320px;
  background: #1a1a1a;
  overflow-y: auto;
  padding: 15px;
  border-right: 2px solid #0f0;
  box-shadow: inset 2px 0 10px rgba(0,255,0,0.1);
  z-index: 100;
}

.sidebar h2 {
  font-size: 14px;
  margin: 15px 0 10px;
  color: #0f0;
  text-shadow: 0 0 5px #0f0;
  text-transform: uppercase;
  letter-spacing: 2px;
  border-bottom: 1px solid #0f0;
  padding-bottom: 8px;
}

.btn {
  width: 100%;
  padding: 10px;
  margin: 5px 0;
  border: 2px solid #0f0;
  background: #0a0a0a;
  color: #0f0;
  font-family: "Courier New", monospace;
  font-weight: bold;
  cursor: pointer;
  font-size: 12px;
  transition: all 0.1s;
  text-transform: uppercase;
  letter-spacing: 1px;
  box-shadow: 0 0 3px #0f0;
}

.btn:hover {
  background: #0f0;
  color: #0a0a0a;
  box-shadow: 0 0 10px #0f0;
}

.file-input { display: none; }

.slider-group {
  margin: 10px 0;
  padding: 8px;
  background: #1a1a1a;
  border: 1px solid #0f0;
  border-radius: 2px;
}

.slider-group label {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  margin-bottom: 5px;
  color: #0f0;
}

input[type="range"] {
  width: 100%;
  height: 3px;
  background: #0f0;
  border: none;
  cursor: pointer;
}

.main-content {
  flex: 1;
  display: flex;
  flex-direction: column;
}

#canvas {
  flex: 1;
  display: block;
  background: #0a0a0a;
}

.timeline {
  background: #1a1a1a;
  border-top: 2px solid #0f0;
  padding: 10px 15px;
  font-size: 11px;
  color: #0f0;
}

.info {
  background: #0a0a0a;
  border: 1px solid #0f0;
  padding: 8px;
  margin-top: 8px;
  font-size: 10px;
  color: #0f0;
}

.models-list {
  font-size: 10px;
  max-height: 100px;
  overflow-y: auto;
  background: #2a2a2a;
  padding: 8px;
  margin-top: 5px;
}

select {
  width: 100%;
  padding: 6px;
  background: #0a0a0a;
  border: 2px solid #0f0;
  color: #0f0;
  font-family: "Courier New", monospace;
  margin-top: 5px;
}
</style>
</head>
<body>

<div class="container">
  <div class="sidebar">
    <h2>⚡ SKIBIDI PRO</h2>
    
    <h2>Modelos GLB</h2>
    <button class="btn" onclick="document.getElementById('fileInput').click()">📂 Cargar GLB</button>
    <input type="file" id="fileInput" class="file-input" accept=".glb,.gltf" onchange="loadGLBFile(event)">
    <div class="models-list" id="modelsList">
      <div style="color: #888; font-size: 9px;">Sin modelos</div>
    </div>

    <h2>Objetos</h2>
    <button class="btn" onclick="addObject('cube')">➕ Cubo</button>
    <button class="btn" onclick="addObject('sphere')">➕ Esfera</button>
    <button class="btn" onclick="addObject('pyramid')">➕ Pirámide</button>

    <h2>Animaciones</h2>
    <select onchange="setAnimationType(this.value)">
      <option value="glitch">🔴 GLITCH</option>
      <option value="spin">⚫ SPIN</option>
      <option value="chaos">⚪ CAOS</option>
      <option value="none">⚫ NINGUNA</option>
    </select>

    <h2>Velocidad</h2>
    <div class="slider-group">
      <label>ANIM <span id="speedVal">1</span></label>
      <input type="range" min="0.1" max="3" value="1" step="0.1" id="speedSlider" oninput="updateSpeed()">
    </div>

    <div class="slider-group">
      <label>CAM <span id="camVal">1</span></label>
      <input type="range" min="0.1" max="3" value="1" step="0.1" id="camSlider" oninput="updateCamSpeed()">
    </div>

    <h2>Distorsión</h2>
    <div class="slider-group">
      <label>GLITCH <span id="glitchVal">0</span></label>
      <input type="range" min="0" max="2" value="0" step="0.1" id="glitchSlider" oninput="updateGlitch()">
    </div>

    <div class="slider-group">
      <label>SHAKE <span id="shakeVal">0</span></label>
      <input type="range" min="0" max="1" value="0" step="0.1" id="shakeSlider" oninput="updateShake()">
    </div>

    <h2>Utilidades</h2>
    <button class="btn" onclick="triggerExplosion()">💥 EXPLOSIÓN</button>
    <button class="btn" onclick="resetScene()">🔄 RESET</button>

    <div class="info">
      WASD: Mover
      MOUSE: Rotar
      ESPACIO/CTRL: Arriba/Abajo
    </div>
  </div>

  <div class="main-content">
    <canvas id="canvas"></canvas>
    <div class="timeline" id="timeline">[ FPS: 60 | POS: 0, 0, 0 ]</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/loaders/GLTFLoader.min.js"></script>
<script>
let scene, camera, renderer, canvas;
let objects = [];
let models = [];
let animType = 'glitch';
let animSpeed = 1;
let camSpeed = 1;
let glitch = 0;
let shake = 0;
let time = 0;
const keys = {};

function init() {
  // Scene
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a0a);
  
  // Camera
  canvas = document.getElementById('canvas');
  camera = new THREE.PerspectiveCamera(75, canvas.clientWidth / canvas.clientHeight, 0.1, 1000);
  camera.position.set(0, 3, 8);
  
  // Renderer
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setSize(canvas.clientWidth, canvas.clientHeight);
  renderer.shadowMap.enabled = true;
  
  // LUCES POTENTES
  const ambient = new THREE.AmbientLight(0xffffff, 1.5);
  scene.add(ambient);
  
  const sun = new THREE.DirectionalLight(0xffffff, 1.5);
  sun.position.set(5, 10, 5);
  sun.castShadow = true;
  scene.add(sun);
  
  const pink = new THREE.PointLight(0xff00ff, 1);
  pink.position.set(-5, 5, 0);
  scene.add(pink);
  
  const cyan = new THREE.PointLight(0x00ffff, 1);
  cyan.position.set(5, 5, 0);
  scene.add(cyan);
  
  // Suelo
  const groundGeo = new THREE.PlaneGeometry(100, 100);
  const groundMat = new THREE.MeshStandardMaterial({ color: 0x1a1a3a });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);
  
  // Grid
  const grid = new THREE.GridHelper(100, 50, 0x00ff00, 0x444444);
  grid.position.y = 0.01;
  scene.add(grid);
  
  // Objetos iniciales
  createDefaultObjects();
  
  // Eventos
  window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
  window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
  
  let dragX = 0, dragY = 0;
  canvas.addEventListener('mousedown', () => dragX = 0, dragY = 0);
  canvas.addEventListener('mousemove', e => {
    if (e.buttons === 1) {
      const dx = e.movementX * 0.005;
      const dy = e.movementY * 0.005;
      const q = new THREE.Quaternion();
      q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), dx);
      camera.position.applyQuaternion(q);
      
      const right = new THREE.Vector3();
      camera.getWorldDirection(right);
      right.applyAxisAngle(new THREE.Vector3(0, 1, 0), Math.PI / 2);
      q.setFromAxisAngle(right, dy);
      camera.position.applyQuaternion(q);
    }
  });
  
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    camera.position.multiplyScalar(1 + e.deltaY * 0.001);
  });
  
  animate();
}

function createDefaultObjects() {
  const colors = [0xff0080, 0x00ff80, 0x8000ff];
  const geos = [
    new THREE.BoxGeometry(1, 1, 1),
    new THREE.IcosahedronGeometry(0.7, 4),
    new THREE.TetrahedronGeometry(1)
  ];
  
  for (let i = 0; i < 3; i++) {
    const mat = new THREE.MeshPhongMaterial({
      color: colors[i],
      emissive: colors[i],
      emissiveIntensity: 0.2,
      shininess: 100
    });
    const mesh = new THREE.Mesh(geos[i], mat);
    mesh.position.x = (i - 1) * 3;
    mesh.position.y = 1;
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    scene.add(mesh);
    objects.push(mesh);
  }
}

function addObject(type) {
  let geo;
  if (type === 'cube') geo = new THREE.BoxGeometry(1, 1, 1);
  else if (type === 'sphere') geo = new THREE.IcosahedronGeometry(0.7, 4);
  else if (type === 'pyramid') geo = new THREE.TetrahedronGeometry(1);
  
  const mat = new THREE.MeshPhongMaterial({
    color: Math.random() * 0xffffff,
    emissive: Math.random() * 0x00ff00,
    shininess: 100
  });
  
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set((Math.random() - 0.5) * 10, 2, (Math.random() - 0.5) * 10);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  objects.push(mesh);
}

function loadGLBFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  
  console.log('📂 Intentando cargar:', file.name);
  
  const reader = new FileReader();
  reader.onload = e => {
    try {
      console.log('📖 Archivo leído, parseando GLB...');
      
      // Verificar que THREE.GLTFLoader exista
      if (!THREE.GLTFLoader) {
        console.error('❌ GLTFLoader no disponible');
        alert('GLTFLoader no cargó. Recarga la página.');
        return;
      }
      
      const loader = new THREE.GLTFLoader();
      console.log('✓ GLTFLoader inicializado');
      
      loader.parse(e.target.result, '', gltf => {
        try {
          console.log('✓ GLB parseado, procesando modelo...');
          
          const model = gltf.scene;
          console.log('📦 Modelo scene:', model);
          
          // Asegurar que los materiales sean visibles
          model.traverse(node => {
            if (node.isMesh) {
              node.castShadow = true;
              node.receiveShadow = true;
              
              // Asegurar que tiene material
              if (!node.material) {
                node.material = new THREE.MeshPhongMaterial({ color: Math.random() * 0xffffff });
              }
            }
          });
          
          // Calcular bounding box
          const box = new THREE.Box3().setFromObject(model);
          const size = box.getSize(new THREE.Vector3());
          const center = box.getCenter(new THREE.Vector3());
          
          console.log('📏 Tamaño modelo:', size);
          console.log('📍 Centro modelo:', center);
          
          // Evitar división por cero
          const maxDim = Math.max(size.x, size.y, size.z);
          if (maxDim === 0) {
            console.error('❌ Modelo tiene tamaño 0');
            alert('Modelo inválido (tamaño 0)');
            return;
          }
          
          // Escalar para que quepa en escena
          const scale = 4 / maxDim;
          console.log('📊 Factor escala:', scale.toFixed(2));
          
          model.scale.multiplyScalar(scale);
          
          // Centrar en origen
          model.position.sub(center.multiplyScalar(scale));
          model.position.y = 0; // En el suelo
          
          // Agregar a la escena
          scene.add(model);
          models.push(model);
          
          console.log('✓ Modelo agregado a scene');
          console.log('✓ Posición:', model.position);
          console.log('✓ Escala:', model.scale);
          
          // Mover cámara para ver el modelo
          const distancia = Math.max(8, maxDim * scale * 1.5);
          const altura = size.y * scale * 0.5;
          
          camera.position.set(0, altura + 2, distancia);
          camera.lookAt(0, altura / 2, 0);
          
          console.log('📷 Cámara en:', camera.position);
          console.log('✅ MODELO CARGADO EXITOSAMENTE');
          
          updateModelsList();
          
        } catch (err) {
          console.error('❌ Error procesando:', err);
          alert('Error: ' + err.message);
        }
        
      }, progress => {
        console.log('⏳ Cargando...', (progress.loaded / progress.total * 100).toFixed(0) + '%');
      }, error => {
        console.error('❌ Error parse:', error);
        alert('Error al parsear: ' + error.message);
      });
      
    } catch (err) {
      console.error('❌ Error catch:', err);
      alert('Error: ' + err.message);
    }
  };
  
  reader.onerror = () => {
    console.error('❌ Error leyendo archivo');
    alert('Error al leer archivo');
  };
  
  reader.readAsArrayBuffer(file);
}

function updateModelsList() {
  const list = document.getElementById('modelsList');
  if (models.length === 0) {
    list.innerHTML = '<div style="color: #888; font-size: 9px;">Sin modelos</div>';
  } else {
    list.innerHTML = models.map((m, i) => {
      const box = new THREE.Box3().setFromObject(m);
      const size = box.getSize(new THREE.Vector3());
      return `<div style="padding: 6px; color: #0f0; border: 1px solid #0f0; margin: 4px 0; border-radius: 2px;">
        📦 Modelo ${i + 1}
        <div style="font-size: 8px; color: #888; margin-top: 2px;">Tamaño: ${size.x.toFixed(1)}×${size.y.toFixed(1)}×${size.z.toFixed(1)}</div>
      </div>`;
    }).join('');
  }
}

function setAnimationType(val) { animType = val; }
function updateSpeed() { animSpeed = parseFloat(document.getElementById('speedSlider').value); document.getElementById('speedVal').textContent = animSpeed.toFixed(1); }
function updateCamSpeed() { camSpeed = parseFloat(document.getElementById('camSlider').value); document.getElementById('camVal').textContent = camSpeed.toFixed(1); }
function updateGlitch() { glitch = parseFloat(document.getElementById('glitchSlider').value); document.getElementById('glitchVal').textContent = glitch.toFixed(1); }
function updateShake() { shake = parseFloat(document.getElementById('shakeSlider').value); document.getElementById('shakeVal').textContent = shake.toFixed(1); }

function triggerExplosion() {
  objects.forEach(o => {
    o.position.x += (Math.random() - 0.5) * 5;
    o.position.y += (Math.random() - 0.5) * 5;
    o.velocity = new THREE.Vector3((Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10);
  });
}

function resetScene() {
  objects.forEach(o => scene.remove(o));
  models.forEach(m => scene.remove(m));
  objects = [];
  models = [];
  updateModelsList();
  createDefaultObjects();
}

function animate() {
  requestAnimationFrame(animate);
  
  time += 0.016 * animSpeed;
  
  // Movimiento cámara WASD
  const speed = 0.2 * camSpeed;
  const forward = new THREE.Vector3();
  camera.getWorldDirection(forward);
  forward.y = 0;
  forward.normalize();
  
  const right = new THREE.Vector3(1, 0, 0);
  right.applyAxisAngle(forward.clone().cross(new THREE.Vector3(0, 1, 0)).normalize(), Math.PI / 2);
  
  if (keys['w']) camera.position.addScaledVector(forward, speed);
  if (keys['s']) camera.position.addScaledVector(forward, -speed);
  if (keys['a']) camera.position.addScaledVector(right, -speed);
  if (keys['d']) camera.position.addScaledVector(right, speed);
  if (keys[' ']) camera.position.y += speed;
  if (keys['control']) camera.position.y -= speed;
  
  // Shake cámara
  if (shake > 0) {
    camera.position.x += (Math.random() - 0.5) * shake * 0.1;
    camera.position.y += (Math.random() - 0.5) * shake * 0.1;
  }
  
  camera.lookAt(0, 0, 0);
  
  // Animar objetos
  objects.forEach((o, i) => {
    if (animType === 'glitch') {
      o.rotation.x += (Math.random() - 0.5) * animSpeed * 0.2;
      o.rotation.y += (Math.random() - 0.5) * animSpeed * 0.2;
    } else if (animType === 'spin') {
      o.rotation.y += animSpeed * 0.05;
      o.rotation.x += animSpeed * 0.02;
    } else if (animType === 'chaos') {
      o.rotation.set(
        Math.sin(time + i) * 3,
        Math.cos(time + i) * 3,
        Math.tan(time + i)
      );
      o.position.y = Math.sin(time + i) * 0.5 + 1;
    }
  });
  
  // Animar modelos
  models.forEach((m, i) => {
    if (animType === 'spin') {
      m.rotation.y += animSpeed * 0.03;
      m.rotation.x += animSpeed * 0.01;
    } else if (animType === 'glitch') {
      m.rotation.x += (Math.random() - 0.5) * animSpeed * 0.1;
      m.rotation.y += (Math.random() - 0.5) * animSpeed * 0.15;
      if (Math.random() > 0.9) {
        m.position.x += (Math.random() - 0.5) * 0.2;
        m.position.z += (Math.random() - 0.5) * 0.2;
      }
    } else if (animType === 'chaos') {
      m.position.y = Math.sin(time + i) * 0.3;
      m.rotation.y = Math.cos(time * 0.5 + i) * 0.5;
    }
  });
  
  // Aplicar glitch
  if (glitch > 0) {
    canvas.style.filter = `hue-rotate(${glitch * 20}deg) saturate(${100 + glitch * 50}%)`;
  } else {
    canvas.style.filter = 'none';
  }
  
  // Render
  renderer.render(scene, camera);
  
  // Timeline
  document.getElementById('timeline').textContent = 
    `[ FPS: 60 | X: ${camera.position.x.toFixed(1)} Y: ${camera.position.y.toFixed(1)} Z: ${camera.position.z.toFixed(1)} ]`;
}

window.addEventListener('resize', () => {
  camera.aspect = canvas.clientWidth / canvas.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(canvas.clientWidth, canvas.clientHeight);
});

// Esperar a que DOM esté listo
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>

</body>
</html>
