<script>

try{Object.assign(st,JSON.parse(localStorage.getItem('ske')||'{}'))}catch(e){}

const $=id=>document.getElementById(id),mult=()=>MULTS[st.mi]*(1+st.rb),rbCost=()=>1500*(st.rb+1);

const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(R.domElement);

S.add(new THREE.AmbientLight(0xffffff,.8));const DL=new THREE.DirectionalLight(0xffffff,.55);DL.position.set(-5,12,8);S.add(DL);

const G=new THREE.BoxGeometry(1,1,1);G.translate(0,.5,0);

cx.font='bold 46px Arial';cx.textAlign='center';cx.textBaseline='middle';
for(let i=0;i<26;i++)cx.fillText(String.fromCharCode(65+i),(i%8)*64+32,(i/8|0)*64+35);
const tex=new THREE.CanvasTexture(cv);
const pg=new THREE.PlaneGeometry(.6,.6);pg.rotateX(-Math.PI/2);
const al=new Float32Array(NN*2);for(let i=0;i<NN;i++){const k=(i*7919+(i>>3)*31)%26;al[i*2]=k%8;al[i*2+1]=k/8|0}

const LT=new THREE.InstancedMesh(pg,new THREE.ShaderMaterial({transparent:true,depthWrite:false,uniforms:{t:{value:tex}},

bc[i*3]=col.r;bc[i*3+1]=col.g;bc[i*3+2]=col.b;T.setColorAt(i,col);col.multiplyScalar(.55);B.setColorAt(i,col);paint(i)}
B.instanceColor.needsUpdate=T.instanceColor.needsUpdate=B.instanceMatrix.needsUpdate=T.instanceMatrix.needsUpdate=LT.instanceMatrix.needsUpdate=true;
DEC.forEach((d,j)=>d.visible=j==k);save();hud()}
// suelo y lobby
const mk=(g,c,x,y,z)=>{const m=new THREE.Mesh(g,new THREE.MeshLambertMaterial({color:c}));m.position.set(x,y,z);S.add(m);return m};
mk(new THREE.BoxGeometry(19,.1,L+8),0x0a0510,0,-.05,-L/2+2);
mk(new THREE.BoxGeometry(46,.2,28),0x4a2c1a,0,-.1,11);

const m=new THREE.Mesh(new THREE.PlaneGeometry(s,s/4),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(k),transparent:true,side:THREE.DoubleSide}));S.add(m);return m}
const sk=document.createElement('canvas');sk.width=sk.height=64;{const x=sk.getContext('2d');x.fillStyle='#555';x.fillRect(0,0,64,64);x.fillStyle='#999';x.fillRect(0,0,64,32)}
const stx=new THREE.CanvasTexture(sk);stx.wrapS=stx.wrapT=THREE.RepeatWrapping;stx.repeat.set(1,4);
const tms=TRD.map((t,k)=>{const x=[-19,-13,13,19][k];mk(new THREE.BoxGeometry(4.6,.5,6.6),t[1],x,.25,12);
const b=new THREE.Mesh(new THREE.BoxGeometry(3.4,.12,5.6),new THREE.MeshLambertMaterial({map:stx.clone()}));b.material.map.needsUpdate=true;b.position.set(x,.56,12);S.add(b);
mk(new THREE.BoxGeometry(.3,1.6,6.6),t[1],x-2.1,.9,12);mk(new THREE.BoxGeometry(.3,1.6,6.6),t[1],x+2.1,.9,12);
const l=label(t[0]+' · +'+t[2]+'/s',5.6,'#'+t[1].toString(16).padStart(6,'0'));l.position.set(x,3.2,8.6);
const r=label(t[3]?'Requiere '+t[3]+' 🏆':'Libre',4,'#fff');r.position.set(x,2.2,8.6);return{x,b,t}});
const pt=new THREE.Mesh(new THREE.TorusGeometry(2.6,.35,10,28),new THREE.MeshBasicMaterial({color:0xb06bff}));pt.position.set(0,3,19);S.add(pt);
label('MUNDOS',6,'#d9b3ff').position.set(0,6.6,19);label('Evento: Halloween ★',7,'#ffb347').position.set(0,8.4,21);
// meta
const go=new THREE.Mesh(new THREE.TorusGeometry(8,.7,10,32),new THREE.MeshBasicMaterial({color:0x7dff8a}));go.position.set(0,8,-L+3);S.add(go);
label('🏁 META',16,'#7dff8a').position.set(0,17.5,-L+3);
const ck=document.createElement('canvas');ck.width=ck.height=128;{const x=ck.getContext('2d');for(let i=0;i<8;i++)for(let j=0;j<8;j++){x.fillStyle=(i+j)%2?'#fff':'#111';x.fillRect(i*16,j*16,16,16)}}
const fl=new THREE.Mesh(new THREE.PlaneGeometry(17,3),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(ck)}));fl.rotation.x=-Math.PI/2;fl.position.set(0,.8,-L+2);S.add(fl);
// decoraciones por mundo
const sph=new THREE.SphereGeometry(1,10,8);
function dec(j,n,f){for(let i=0;i<n;i++){const m=f(i);DEC[j].add(m)}}
dec(0,50,i=>{const m=new THREE.Mesh(sph,new THREE.MeshLambertMaterial({color:[0xff6fb5,0x6bc5ff,0x7ac943,0xffd23f][i%4]}));m.position.set((Math.random()-.5)*60,3+Math.random()*14,Math.random()*30-8);m.scale.setScalar(.5+Math.random()*1.3);return m});
dec(1,26,i=>{const m=new THREE.Mesh(sph,new THREE.MeshLambertMaterial({color:0xff7a1a,emissive:0x662200}));const s=i%2?-1:1;m.position.set(s*(11+Math.random()*10),.9,Math.random()*24-4);m.scale.set(1,.8,1);if(i<8){m.position.set(s*(10),.8,-i*40);m.scale.set(1.6,1.3,1.6)}return m});
dec(2,20,i=>{const m=mk(new THREE.BoxGeometry(.6,8+Math.random()*10,.6),[0x00ffe1,0xff00e6,0x39ff14][i%3],(i%2?1:-1)*(11+i*1.2),0,-i*22+10);m.material=new THREE.MeshBasicMaterial({color:[0x00ffe1,0xff00e6,0x39ff14][i%3]});S.remove(m);m.position.y=5;return m});
// personajes
function fig(c){const g=new THREE.Group(),b=new THREE.Mesh(new THREE.CylinderGeometry(.22,.3,.6,10),new THREE.MeshLambertMaterial({color:c})),h=new THREE.Mesh(new THREE.SphereGeometry(.24,12,10),new THREE.MeshLambertMaterial({color:0xffe3c4}));
b.position.y=.3;h.position.y=.85;g.add(b,h);S.add(g);return g}
const me=fig(0x222233),P={x:0,z:6,a:0,cell:-1,tr:0};
const NMS=['Kiwi','Lava','Nova','Zeta','Coco','Pixel','Turbo','Mango'];
const bots=NMS.map((n,i)=>({n,spd:50+Math.random()*3000,wins:Math.random()*30|0,rb:Math.random()*5|0,x:(Math.random()-.5)*14,z:-Math.random()*(L-60),m:fig([0xff5252,0x2f6bff,0x7ac943,0xff9a3c,0xb06bff,0xffd23f,0x2fd0ff,0xff6fb5][i])}));
// obstáculos
const OB=[];let inv=0;
const om=c=>new THREE.MeshLambertMaterial({color:c,emissive:c,emissiveIntensity:.25});
for(let i=0;i<15;i++){const z=-45-i*27,t=i%3,o={t,z,ph:i*1.7};
if(t==0){o.m=new THREE.Mesh(new THREE.SphereGeometry(1.1,14,10),om(0xff7a1a));o.m.position.set(0,1.1,z)}
if(t==1){o.m=new THREE.Group();o.a=new THREE.Mesh(new THREE.BoxGeometry(1,1.8,.9),om(0xff3b3b));o.b=o.a.clone();o.m.add(o.a,o.b);o.m.position.set(0,.9,z)}
if(t==2){o.m=new THREE.Group();o.px=(i%2?-1:1)*2.5;o.m.add(new THREE.Mesh(new THREE.BoxGeometry(9,.5,.6),om(0xffd23f)),new THREE.Mesh(new THREE.CylinderGeometry(.35,.35,1.6,8),om(0xffffff)));o.m.position.set(o.px,.9,z)}
S.add(o.m);OB.push(o)}
function knock(){inv=1.6;const l=Math.floor(st.speed*.15);st.speed-=l;P.z=Math.min(P.z+12,5);P.cell=-1;msg('💥 ¡Obstáculo! −'+fmt(l)+' Speed');click();hud()}
// HUD y paneles
let msgT;function msg(t){const e=$('msg');e.textContent=t;e.style.opacity=1;clearTimeout(msgT);msgT=setTimeout(()=>e.style.opacity=0,2200)}
let dirty=1,open=null;
function hud(){dirty=1}
function drawHud(){$('hud').innerHTML=`<div class="c"><small>⚡ SPEED</small>${fmt(st.speed)}</div><div class="c"><small>🏆 WINS</small>${st.wins}</div><div class="c"><small>🔄 REBIRTH</small>${st.rb}</div><div class="c"><small>MULTIPLIER</small>x${mult()}</div>`;if(open)panel(open)}
$('bar').innerHTML=[['shop','🛒 Shop'],['rb','🔄 Rebirth'],['worlds','🌍 Worlds'],['trails','✨ Trails'],['top','🏅 Top'],['set','⚙️ Settings'],['codes','🎟️ Codes']].map(([k,t])=>`<button data-p="${k}">${t}</button>`).join('');
$('bar').onclick=e=>{const k=e.target.dataset.p;if(k)open==k?shut():panel(k)};

if(m=='worlds')h+=WD.map((w,i)=>`<div class="it"><div><b>${w.n}</b> ${i==st.w?'✔':''}<br><small>Requiere ${w.req} 🏆</small></div><button data-w="${i}" ${st.wins<w.req||i==st.w?'disabled':''}>Ir</button></div>`).join('');
if(m=='trails')h+=TRL.map((t,i)=>`<div class="it"><div><b>${t[0]}</b> ${i==st.tr?'✔':''}<br><small>Requiere ${t[2]} 🏆</small></div><button data-t="${i}" ${st.wins<t[2]||i==st.tr?'disabled':''}>Usar</button></div>`).join('');
if(m=='top')h+=`<div class="tp"><div><b>Top Speed</b>${topList('speed')}</div><div><b>Top Wins</b>${topList('wins')}</div><div><b>Top Rebirths</b>${topList('rb')}</div></div>`;
if(m=='set')h+=`<div class="it"><span>Sonido de teclas</span><button data-s="1">${st.mute?'Apagado':'Activado'}</button></div><div class="it"><span>Reiniciar todo el progreso</span><button data-z="1">Borrar</button></div>`;
if(m=='games')h+=`<div class="it"><div><b>Rellena el mapa 3D</b><br><small>Juego de territorios: rodea áreas y rellénalas</small></div><a href="https://claude.ai/artifact/TPhNKXhJuZRdq4SqcfMbzr" target="_blank" rel="noopener"><button>Jugar</button></a></div>`;
if(m=='codes')h+=`<div class="it"><input id="ci" placeholder="Escribe un código"><button data-c="1">Canjear</button></div><small>Prueba: SPEED, WIN, HALLOWEEN</small>`;
p.innerHTML=h}
$('pan').onclick=e=>{const d=e.target.dataset;if(d.x)shut();

// controles

addEventListener('keydown',e=>{if(e.target.tagName!='INPUT')keys.add(e.key.toLowerCase())});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
const joy=$('joy'),kn=$('kn');

<script>

const je=e=>{if(e.pointerId==jid){jid=null;jx=jz=0;kn.style.transform='translate(-50%,-50%)'}};joy.addEventListener('pointerup',je);joy.addEventListener('pointercancel',je);
$('jp').addEventListener('pointerdown',e=>{e.preventDefault();jump=1});
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('pointerdown',e=>{if(e.target.closest&&e.target.closest('#joy,#jp,#ov,#top'))return;if(e.pointerType=='mouse'&&e.button!=2)return;if(!drag)drag={id:e.pointerId,x:e.clientX,y:e.clientY}});
addEventListener('pointermove',e=>{if(!drag||e.pointerId!=drag.id)return;yaw-=(e.clientX-drag.x)*.006;pit=Math.max(.15,Math.min(1.4,pit+(e.clientY-drag.y)*.005));drag.x=e.clientX;drag.y=e.clientY});
const dEnd=e=>{if(drag&&e.pointerId==drag.id)drag=null};addEventListener('pointerup',dEnd);addEventListener('pointercancel',dEnd);
addEventListener('wheel',e=>{cz=Math.max(6,Math.min(30,cz*Math.exp(e.deltaY*.001)))},{passive:true});
function warn(i){if(i>=0&&ts[i]==0){ts[i]=1;tm[i]=Math.max(.45,1.4-t*.01);tcol(i);M.instanceColor.needsUpdate=true}}
function upd(dt){tt+=dt;
if(state=='count'){cd-=dt;$('msg').textContent=cd>0?Math.ceil(cd):'';if(cd<=0){state='play';$('msg').textContent=''}return}
if(state!='play')return;dt*=sf;t+=dt;wt-=dt;if(wt<=0){wt=Math.max(.3,1.1-t*.012);warn(Math.random()*NN|0)}
for(let i=0;i<NN;i++){if(ts[i]==1){tm[i]-=dt;if(tm[i]<=0){ts[i]=2;tv[i]=0}}if(ts[i]==2){tv[i]+=22*dt;ty[i]-=tv[i]*dt}}
const al=all.filter(p=>p.alive);
for(const p of al){let vx=0,vz=0;
if(p.me){vx=jx;vz=jz;if(keys.has('a')||keys.has('arrowleft'))vx--;if(keys.has('d')||keys.has('arrowright'))vx++;if(keys.has('w')||keys.has('arrowup'))vz--;if(keys.has('s')||keys.has('arrowdown'))vz++;
const m=Math.hypot(vx,vz);if(m>.1){const cy=Math.cos(yaw),sy=Math.sin(yaw),wx=vx*cy+vz*sy,wz=-vx*sy+vz*cy,k=p.sp/Math.max(1,m);vx=wx*k;vz=wz*k;p.a=Math.atan2(wx,wz)}else vx=vz=0}
else{p.tt-=dt;if(p.tt<=0||!p.tg){p.tt=.7+Math.random()*.8;const c=[];for(let i=0;i<NN;i++)if(ts[i]==0&&Math.hypot(tx(i)-p.x,tz(i)-p.z)<7)c.push(i);const i=c.length?c[Math.random()*c.length|0]:(Math.random()*NN|0);p.tg=[tx(i),tz(i)]}
const dx=p.tg[0]-p.x,dz=p.tg[1]-p.z,d=Math.hypot(dx,dz);if(d>.3){vx=dx/d*p.sp;vz=dz/d*p.sp;p.a=Math.atan2(dx,dz)}
const ci=ti(p.x,p.z);if(ci>=0&&ts[ci]==1&&p.vy==0&&p.y==0)p.tt=0;if(p.y==0&&Math.random()<dt*.25)p.vy=8}
p.x+=vx*dt;p.z+=vz*dt;
const i=ti(p.x,p.z),solid=i>=0&&ts[i]!=2;
if(p.me&&jump){if(p.y==0)p.vy=8.5;jump=0}
if(solid&&p.y<=0&&p.vy<=0&&p.y>-.6){p.y=0;p.vy=0;if(ts[i]==0)warn(i)}else{p.vy-=22*dt;p.y+=p.vy*dt}
if(p.y<-12){p.alive=0;p.dead=tt;if(p.me){place=al.length;sf=2.5}}}
for(let a=0;a<al.length;a++)for(let b=a+1;b<al.length;b++){const A=al[a],B=al[b];if(!A.alive||!B.alive)continue;const dx=B.x-A.x,dz=B.z-A.z,d=Math.hypot(dx,dz);if(d<.8&&d>.01&&Math.abs(A.y-B.y)<1){const k=(.8-d)/2/d;A.x-=dx*k;A.z-=dz*k;B.x+=dx*k;B.z+=dz*k}}
const left=all.filter(p=>p.alive);if(left.length<=1)endRound(left[0]||all[1])}
function draw(){for(let i=0;i<NN;i++){const sh=ts[i]==1?Math.sin(tt*60+i)*.04:0;dm.position.set(tx(i)+sh,ty[i],tz(i));dm.scale.set(1,.5,1);dm.updateMatrix();M.setMatrixAt(i,dm.matrix);dm.position.y=ty[i]+.01;dm.scale.set(1,1,1);dm.updateMatrix();LT.setMatrixAt(i,dm.matrix)}
M.instanceMatrix.needsUpdate=LT.instanceMatrix.needsUpdate=true;
for(const p of all){p.g.position.set(p.x,p.y,p.z);p.g.rotation.y=p.a||0;p.g.visible=p.y>-14}
const tg=me&&me.alive?me:all.filter(p=>p.alive)[0]||me,hz=Math.cos(pit)*cz,tgx=tg?tg.x:0,tgy=tg?Math.max(tg.y,-3):0,tgz=tg?tg.z:0;
C.position.x+=(tgx+Math.sin(yaw)*hz-C.position.x)*.2;C.position.y+=(tgy+1.5+Math.sin(pit)*cz-C.position.y)*.2;C.position.z+=(tgz+Math.cos(yaw)*hz-C.position.z)*.2;C.lookAt(tgx,tgy+1,tgz);
R.render(S,C);$('al').textContent='👥 Vivos: '+all.filter(p=>p.alive).length;$('tm').textContent='⏱ '+Math.floor(t)+' s'}
let last=performance.now();function loop(n){const dt=Math.min((n-last)/1000,.05);last=n;upd(dt);draw();requestAnimationFrame(loop)}
for(let i=0;i<NN;i++)tcol(i);M.instanceColor.needsUpdate=true;C.position.set(0,12,12);menu();requestAnimationFrame(loop);

<script>

$('cards').onclick=e=>{const b=e.target.closest('.cd');if(b){const i=+b.dataset.i;i==cur?$('menu').style.display='none':load(i)}};
