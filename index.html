<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YEI Social P2P</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#f2f3f5;
 font-family:Arial,sans-serif;
 color:#111
}
header{
 background:white;
 padding:15px;
 text-align:center;
 font-size:23px;
 font-weight:bold;
 border-bottom:1px solid #ddd
}
main{
 max-width:650px;
 margin:20px auto;
 padding:10px
}
.box,.post{
 background:white;
 padding:15px;
 border-radius:15px;
 margin-bottom:12px;
 border:1px solid #ddd
}
input,textarea,button{
 width:100%;
 padding:11px;
 margin:5px 0;
 border-radius:9px;
 border:1px solid #ccc;
 font-size:15px
}
button{
 background:#111827;
 color:white;
 cursor:pointer
}
button:hover{opacity:.9}
.post img{
 max-width:100%;
 border-radius:12px;
 margin-top:8px
}
.like{
 width:auto;
 color:#ef4444;
 background:white;
 border:1px solid #ddd
}
small{color:#666}
.online{color:#159447}
</style>
</head>

<body>

<header>
🌐 YEI Social
</header>

<main>

<div class="box">

<input id="name" placeholder="Tu nombre">

<button onclick="crearSala()">
🏠 Crear sala
</button>

<hr>

<input id="room" placeholder="Código de sala, ejemplo XD-429">

<button onclick="entrarSala()">
🚪 Entrar a sala
</button>

<p id="estado">⚪ Sin conexión</p>

<p>
🔑 Tu código:
<b id="codigo">---</b>
</p>

<small>
Comparte tu código con tus amigos para que entren a la misma sala.
</small>

</div>


<div class="box">

<textarea
id="texto"
rows="3"
placeholder="¿Qué estás pensando?"
></textarea>

<input
id="foto"
type="file"
accept="image/*"
>

<button onclick="publicar()">
📢 Publicar
</button>

</div>


<div id="feed"></div>

</main>


<script>

let peer;
let conexiones=[];
let publicaciones=[];

let usuario=
localStorage.getItem("nombre") ||
"Usuario";


name.value=usuario;


/* CREAR SALA */

function crearSala(){

 usuario=name.value.trim()||"Usuario";

 localStorage.setItem(
  "nombre",
  usuario
 );

 if(peer)return;

 let codigoSala=
 "XD-"+Math.floor(
  100+Math.random()*900
 );

 peer=new Peer(codigoSala);

 peer.on("open",id=>{

  codigo.textContent=id;

  estado.textContent=
   "🟢 Sala creada: "+id;

  estado.className="online";

 });

 peer.on("connection",conexion=>{
  prepararConexion(conexion);
 });

 peer.on("error",e=>{
  estado.textContent=
   "❌ Error: "+e.type;
 });

}


/* ENTRAR */

function entrarSala(){

 let id=room.value
  .trim()
  .toUpperCase();

 if(!id)return;

 usuario=name.value.trim()||"Usuario";

 localStorage.setItem(
  "nombre",
  usuario
 );

 if(!peer){

  peer=new Peer();

  peer.on("open",miID=>{

   codigo.textContent=miID;

   conectar(id);

  });

 }else{

  conectar(id);

 }

}


/* CONECTAR */

function conectar(id){

 let conexion=
  peer.connect(id);

 prepararConexion(conexion);

}


/* PREPARAR CONEXIÓN */

function prepararConexion(c){

 c.on("open",()=>{

  if(!conexiones.includes(c))
   conexiones.push(c);

  estado.textContent=
   "🟢 Conectado • "+
   conexiones.length+
   " usuario(s)";

  /* mandar publicaciones actuales */

  c.send({
   tipo:"sync",
   publicaciones:publicaciones
  });

 });


 c.on("data",datos=>{

  /* sincronizar */

  if(datos.tipo==="sync"){

   datos.publicaciones.forEach(
    agregarPublicacion
   );

   mostrar();

  }


  /* nueva publicación */

  if(datos.tipo==="publicacion"){

   if(
    agregarPublicacion(
     datos.publicacion
    )
   ){

    mostrar();

    repartir(
     datos,
     c
    );

   }

  }


  /* like */

  if(datos.tipo==="like"){

   let p=
    publicaciones.find(
     x=>x.id===datos.id
    );

   if(p){

    p.likes++;

    mostrar();

    repartir(
     datos,
     c
    );

   }

  }

 });


 c.on("close",()=>{

  conexiones=
   conexiones.filter(
    x=>x!==c
   );

  estado.textContent=
   "🟢 Conectados: "+
   conexiones.length;

 });

}


/* ENVIAR A TODOS */

function repartir(datos,excepto){

 conexiones.forEach(c=>{

  if(
   c!==excepto &&
   c.open
  ){

   c.send(datos);

  }

 });

}


/* PUBLICAR */

function publicar(){

 let texto=
  document.getElementById(
   "texto"
  ).value.trim();

 let archivo=
  document.getElementById(
   "foto"
  ).files[0];

 if(!texto&&!archivo)return;


 if(archivo){

  let lector=
   new FileReader();

  lector.onload=()=>{

   crearPublicacion(
    texto,
    lector.result
   );

  };

  lector.readAsDataURL(
   archivo
  );

 }else{

  crearPublicacion(
   texto,
   ""
  );

 }

}


/* CREAR PUBLICACIÓN */

function crearPublicacion(
 texto,
 imagen
){

 let publicacion={

  id:
   Date.now()+
   Math.random(),

  nombre:usuario,

  texto:texto,

  imagen:imagen,

  likes:0

 };


 agregarPublicacion(
  publicacion
 );

 mostrar();


 repartir({

  tipo:"publicacion",

  publicacion:
   publicacion

 });

 document.getElementById(
  "texto"
 ).value="";

 document.getElementById(
  "foto"
 ).value="";

}


/* AGREGAR */

function agregarPublicacion(p){

 if(
  publicaciones.some(
   x=>x.id===p.id
  )
 )return false;

 publicaciones.push(p);

 return true;

}


/* LIKE */

function like(id){

 let p=
  publicaciones.find(
   x=>x.id===id
  );

 if(!p)return;

 p.likes++;

 mostrar();

 repartir({

  tipo:"like",

  id:id

 });

}


/* MOSTRAR FEED */

function mostrar(){

 let feed=
  document.getElementById(
   "feed"
  );

 if(!publicaciones.length){

  feed.innerHTML=
   "<div class='box'>"+
   "📭 No hay publicaciones"+
   "</div>";

  return;

 }


 feed.innerHTML=
  publicaciones
   .slice()
   .reverse()
   .map(p=>`

<div class="post">

<b>👤 ${escapar(p.nombre)}</b>

<br>

<small>
Publicación P2P
</small>

<p>
${escapar(p.texto)}
</p>

${
 p.imagen
 ?
 `<img src="${p.imagen}">`
 :
 ""
}

<br>

<button
class="like"
onclick="like(${p.id})"
>
❤️ ${p.likes}
</button>

</div>

`).join("");

}


/* SEGURIDAD TEXTO */

function escapar(texto){

 return String(texto||"")
 .replace(
  /[&<>"']/g,
  x=>({

   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#39;"

  }[x])
 );

}


/* INICIAR */

mostrar();

crearSala();

</script>

</body>
</html>
