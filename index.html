for(let i=0;i<15;i++){const z=-45-i*27,t=i%3,o={t,z,ph:i*1.7};

C.fov=62+v*.3;C.updateProjectionMatrix();

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>
<script>
const N=48,SP=5.2,PAL=[0x2fd0ff,0x2f6bff,0x7ac943,0xff6fb5,0xff9a3c,0xb06bff,0xffd23f,0xff5252];

const S=new THREE.Scene();S.background=new THREE.Color(0x0a1a8a);S.fog=new THREE.Fog(0x0a1a8a,24,52);
const C=new THREE.PerspectiveCamera(50,1,.1,100);
S.add(new THREE.AmbientLight(0xffffff,.8));const DL=new THREE.DirectionalLight(0xffffff,.6);DL.position.set(-5,10,6);S.add(DL);
function rs(){R.setSize(innerWidth,innerHeight);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix()}addEventListener('resize',rs);rs();

// tablero
const g=new THREE.BoxGeometry(.92,1,.92);g.translate(0,.5,0);
const M=new THREE.InstancedMesh(g,new THREE.MeshLambertMaterial(),NN);M.frustumCulled=false;S.add(M);
const cv=document.createElement('canvas');cv.width=512;cv.height=256;const cx=cv.getContext('2d');
cx.font='bold 46px Arial,sans-serif';cx.textAlign='center';cx.textBaseline='middle';
for(let i=0;i<26;i++)cx.fillText(String.fromCharCode(65+i),(i%8)*64+32,(i/8|0)*64+35);
const tex=new THREE.CanvasTexture(cv);tex.anisotropy=4;
const pg=new THREE.PlaneGeometry(.7,.7);pg.rotateX(-Math.PI/2);
const al=new Float32Array(NN*2);for(let i=0;i<NN;i++){const k=(i*7919+(i>>3)*31)%26;al[i*2]=k%8;al[i*2+1]=k/8|0}

vertexShader:'attribute vec2 aLet;varying vec2 v;void main(){v=vec2((aLet.x+uv.x)/8.,(3.-aLet.y+uv.y)/4.);gl_Position=projectionMatrix*modelViewMatrix*instanceMatrix*vec4(position,1.);}',
fragmentShader:'uniform sampler2D t;varying vec2 v;void main(){gl_FragColor=vec4(.07,.08,.16,texture2D(t,v).a*.9);}'}),NN);
LT.frustumCulled=false;S.add(LT);
const dm=new THREE.Object3D(),col=new THREE.Color(),WH=new THREE.Color(1,1,1),H=[.4,.8,.62];
const oc=new Int32Array(NN),tc=new Int32Array(NN);

dm.position.set(i%N-N/2,0,(i/N|0)-N/2);dm.scale.set(1,h,1);dm.updateMatrix();M.setMatrixAt(i,dm.matrix);
col.set(0xdfe6fb);if(oc[i])col.set(oc[i]);if(tc[i])col.set(tc[i]).lerp(WH,.45);M.setColorAt(i,col);

function fig(c){const g=new THREE.Group();
const b=new THREE.Mesh(new THREE.CylinderGeometry(.22,.3,.6,10),new THREE.MeshLambertMaterial({color:c}));b.position.y=.3;
const h=new THREE.Mesh(new THREE.SphereGeometry(.24,12,10),new THREE.MeshLambertMaterial({color:0xffe3c4}));h.position.y=.85;
g.add(b,h);S.add(g);return g}

// estado
const UP={vel:{n:'Velocidad',d:'Corres más rápido',max:5,c:l=>40*(l+1)},agi:{n:'Agilidad',d:'Giras más rápido',max:4,c:l=>30*(l+1)},mon:{n:'Imán de monedas',d:'+25% de monedas al capturar',max:3,c:l=>60*(l+1)},area:{n:'Base grande',d:'Empiezas con más territorio',max:2,c:l=>100*(l+1)},sh:{n:'Escudo',d:'Sobrevives a un corte de estela',max:3,cons:1,c:()=>80}};
const st={coins:0,vel:0,agi:0,mon:0,area:0,sh:0,ci:null,sfx:1};
try{Object.assign(st,JSON.parse(localStorage.getItem('t3d')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('t3d',JSON.stringify(st))}catch(e){}};
const me={name:'Tú',ci:st.ci!=null?st.ci%PAL.length:Math.random()*PAL.length|0,x:N/2,z:N/2,a:0,ta:0,cell:-1,bits:new Uint8Array(NN),T:0,trail:[]};

function push(full){if(!room)return;const o={x:+me.x.toFixed(2),z:+me.z.toFixed(2),a:+me.a.toFixed(2)};
if(full){o.n=me.name;o.c=me.ci;o.b=enc(me.bits);o.T=me.T;o.t=enct(me.trail)}room.presence(o).catch(()=>{})}

// quién es dueño de cada celda: gana la captura más reciente

let lost=false;for(let i=0;i<NN;i++)if(me.bits[i]&&own[i]!==0){me.bits[i]=0;lost=true}
L.forEach((c,k)=>{if(c.bot)for(let i=0;i<NN;i++)if(c.bits[i]&&own[i]!==k)c.bits[i]=0});
tc.fill(0);const cnt=new Array(L.length).fill(0);
for(let i=0;i<NN;i++){oc[i]=own[i]<0?0:PAL[L[own[i]].ci];if(own[i]>=0)cnt[own[i]]++}
for(const c of L)for(const i of c.trail)tc[i]=PAL[c.ci];
if(lost)push(true);
bar.innerHTML=L.map((c,k)=>({c,k,v:cnt[k]*100/NN})).sort((a,b)=>a.v-b.v).map(({c,k,v})=>
`<div class="seg${k?'':' me'}" style="flex:${Math.max(v,8)};background:#${PAL[c.ci].toString(16).padStart(6,'0')}"><b>${esc((c.name||'?')[0])}</b><span>${v.toFixed(1)}%</span></div>`).join('');
hint.textContent=solo?'Un jugador contra '+peers.size+' bots':!code?'':!room?(joining?'Conectando con la sala…':'Sin conexión: '+why):`Sala ${code}`+(peers.size?` · ${peers.size+1} jugadores`:' · comparte el código para jugar con otros');

const esc=s=>String(s).replace(/[&<>"]/g,'');

function spawn(){resolve();let x=N>>1,z=N>>1;
for(let n=0;n<300;n++){const a=5+Math.random()*(N-10)|0,c=5+Math.random()*(N-10)|0;let ok=true;
for(let i=-5;i<=5&&ok;i++)for(let j=-5;j<=5;j++){const k=(c+j)*N+a+i;if(oc[k]||tc[k]){ok=false;break}}
if(ok){x=a;z=c;break}}
const r=2+st.area;for(let i=-r;i<=r;i++)for(let j=-r;j<=r;j++)me.bits[(z+j)*N+x+i]=1;
P.moved=false;me.T=Date.now();me.x=x;me.z=z;me.cell=z*N+x;me.a=me.ta=Math.random()*6.28;started=false;dirty=true;push(true)}
function die(){if(st.sh>0&&me.bits.indexOf(1)>=0){st.sh--;save();myTr.fill(0);me.trail=[];const i=me.bits.indexOf(1);me.x=i%N;me.z=i/N|0;me.cell=i;dirty=true;push(true);upd();msg('¡Escudo usado! Te salvaste');return true}
dieSound();me.bits.fill(0);myTr.fill(0);me.trail=[];spawn();msg('Te cortaron. Muévete para volver a empezar')}
function capture(){const B=new Uint8Array(NN),q=[];const push_=i=>{if(!B[i]&&!me.bits[i]&&!myTr[i]){B[i]=1;q.push(i)}};
for(let k=0;k<N;k++){push_(k);push_((N-1)*N+k);push_(k*N);push_(k*N+N-1)}
while(q.length){const i=q.pop(),x=i%N,z=i/N|0;if(x>0)push_(i-1);if(x<N-1)push_(i+1);if(z>0)push_(i-N);if(z<N-1)push_(i+N)}
let gn=0;for(let i=0;i<NN;i++)if(!B[i]){if(!me.bits[i])gn++;me.bits[i]=1}
if(gn){const c=Math.round(gn*(1+.25*st.mon));st.coins+=c;save();upd();msg('+'+c+' 🪙');capSound()}
myTr.fill(0);me.trail=[];me.T=Date.now();dirty=true;push(true)}
function enter(c){const p=me.cell;me.cell=c;click(.55,.8+((al[c*2]+al[c*2+1]*8)%8)*.06);
if(myTr[c]&&me.trail.slice(-3).indexOf(c)<0){die();return true}
if(me.bits[c]){if(me.trail.length)capture();return false}
if(!myTr[c]){const lx=p%N,lz=p/N|0,cx2=c%N,cz=c/N|0;
if(lx!=cx2&&lz!=cz){const e=lz*N+cx2;if(!me.bits[e]&&!myTr[e]){myTr[e]=1;me.trail.push(e)}}
