    }
    for (let i=27;i<36;i++) {
      const el = document.createElement('div'); el.className='slot';
      this.renderSlotContent(el, Game.inventory.slots[i]);
      el.addEventListener('click', () => { this.onInventorySlotClick(i); this.rebuildFurnaceScreen(); });
      hotbarGrid.appendChild(el);
    }
    document.getElementById('fireFill').style.height = Math.floor((Game.furnace.cookProgress/Game.furnace.cookMax)*100)+'%';
  },
  onFurnaceSlotClick(which) {
    const f = Game.furnace;
    if (!this._heldItem) {
      if (f[which]) { this._heldItem = f[which]; f[which] = null; }
    } else {
      if (!f[which]) { f[which] = this._heldItem; this._heldItem = null; }
      else if (f[which].item === this._heldItem.item) {
        const max = getStackSize(this._heldItem.item);
        const total = f[which].count + this._heldItem.count;
        f[which].count = Math.min(max,total);
        this._heldItem = (total>max)?{item:this._heldItem.item,count:total-max}:null;
      } else {
        const tmp = f[which]; f[which] = this._heldItem; this._heldItem = tmp;
      }
    }
    this.rebuildFurnaceScreen();
  },
  onFurnaceCollectOutput() {
    const f = Game.furnace;
    if (!f.output) return;
    if (!this._heldItem) { this._heldItem = f.output; f.output = null; }
    this.rebuildFurnaceScreen();
  }
};

/* =====================================================================
   SISTEMA: MOBS
   Cada mob es un grupo de mallas simples (cabeza, cuerpo, patas) —
   nunca un único cubo — con textura pixel-art propia y animación básica
   de caminata. La IA se resuelve con máquinas de estado simples por tipo.
   ===================================================================== */
const MOB_TYPE = {
  ZOMBIE:'zombie', CREEPER:'creeper', SKELETON:'skeleton', SPIDER:'spider',
  PIG:'pig', COW:'cow', SHEEP:'sheep', CHICKEN:'chicken'
};
const HOSTILE_MOBS = [MOB_TYPE.ZOMBIE, MOB_TYPE.CREEPER, MOB_TYPE.SKELETON, MOB_TYPE.SPIDER];
const ANIMAL_MOBS = [MOB_TYPE.PIG, MOB_TYPE.COW, MOB_TYPE.SHEEP, MOB_TYPE.CHICKEN];

const MobConfig = {
  [MOB_TYPE.ZOMBIE]:   { maxHealth:20, speed:1.6, damage:3, detectRange:14, attackRange:1.1, bodyColor:'#3a7d44', skinColor:'#4a9d54', drops:[] },
  [MOB_TYPE.CREEPER]:  { maxHealth:20, speed:1.4, damage:0, detectRange:12, attackRange:2.2, bodyColor:'#4caf50', skinColor:'#5cbf60', drops:[], explodes:true, fuseTime:1.5, explosionRadius:3 },
  [MOB_TYPE.SKELETON]: { maxHealth:20, speed:1.3, damage:2, detectRange:16, attackRange:8, bodyColor:'#d8d8c8', skinColor:'#e8e8d8', drops:[], ranged:true },
  [MOB_TYPE.SPIDER]:   { maxHealth:16, speed:2.2, damage:2, detectRange:14, attackRange:1.3, bodyColor:'#2a1a1a', skinColor:'#3a2a2a', drops:[] },
  [MOB_TYPE.PIG]:      { maxHealth:10, speed:1.0, damage:0, detectRange:0, attackRange:0, bodyColor:'#e8a0a8', skinColor:'#f0b0b8', drops:[{item:ITEM.RAW_PORKCHOP,count:[1,3]}] },
  [MOB_TYPE.COW]:      { maxHealth:10, speed:0.9, damage:0, detectRange:0, attackRange:0, bodyColor:'#4a3a2a', skinColor:'#5a4a3a', drops:[{item:ITEM.RAW_BEEF,count:[1,3]}] },
  [MOB_TYPE.SHEEP]:    { maxHealth:8, speed:0.9, damage:0, detectRange:0, attackRange:0, bodyColor:'#e8e8e0', skinColor:'#f0f0e8', drops:[{item:ITEM.WOOL,count:[1,2]}] },
  [MOB_TYPE.CHICKEN]:  { maxHealth:4, speed:1.1, damage:0, detectRange:0, attackRange:0, bodyColor:'#f0f0f0', skinColor:'#ffffff', drops:[{item:ITEM.RAW_CHICKEN,count:[1,1]}] },
};

function makeSolidColorTexture(hexColor, seed) {
  const c = makeCanvas(); const ctx = c.getContext('2d');
  speckle(ctx, hexColor, [hexColor], seed||1, 0); // color sólido con textura base (sin ruido, pero reutiliza el pipeline pixel-art)
  return toTexture(c);
}

class Mob {
  constructor(scene, type, position) {
    this.scene = scene;
    this.type = type;
    this.cfg = MobConfig[type];
    this.health = this.cfg.maxHealth;
    this.pos = position.clone();
    this.vel = new THREE.Vector3(0,0,0);
    this.onGround = false;
    this.yaw = Math.random()*Math.PI*2;
    this.state = 'idle'; // idle, wander, chase, attack, flee, fuse(creeper)
    this.stateTimer = 0;
    this.wanderTarget = null;
    this.fuseTimer = 0;
    this.attackCooldown = 0;
    this.dead = false;
    this.group = this.buildModel();
    this.group.position.copy(this.pos);
    scene.add(this.group);
  }

  // Construye el modelo en partes: cabeza, cuerpo, 4 patas (o menos para gallina/araña con más patas)
  buildModel() {
    const cfg = this.cfg;
    const group = new THREE.Group();
    const bodyMat = new THREE.MeshLambertMaterial({ map: makeSolidColorTexture(cfg.bodyColor, 1) });
    const headMat = new THREE.MeshLambertMaterial({ map: makeSolidColorTexture(cfg.skinColor, 2) });
    const legMat = new THREE.MeshLambertMaterial({ map: makeSolidColorTexture(cfg.bodyColor, 3) });

    const isSpider = this.type === MOB_TYPE.SPIDER;
    const isChicken = this.type === MOB_TYPE.CHICKEN;
    const bodyW = isSpider ? 0.9 : 0.55, bodyH = isSpider?0.35:0.55, bodyD = isSpider?0.7:0.35;

    const bodyGeo = new THREE.BoxGeometry(bodyW, bodyH, bodyD);
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = isSpider ? 0.5 : 0.75;
    group.add(body);
    this.bodyMesh = body;

    const headSize = isChicken ? 0.22 : 0.32;
    const headGeo = new THREE.BoxGeometry(headSize, headSize, headSize);
    const head = new THREE.Mesh(headGeo, headMat);
    head.position.set(0, body.position.y + bodyH/2 + headSize/2 - 0.02, bodyD/2 + headSize/2 - 0.05);
    group.add(head);
    this.headMesh = head;

    // ojos simples (para dar sensación de rostro sin depender de UV mapping complejo)
    if (!isSpider) {
      const eyeMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
      const eyeGeo = new THREE.BoxGeometry(0.04,0.04,0.02);
      const eyeL = new THREE.Mesh(eyeGeo, eyeMat); eyeL.position.set(-headSize*0.22, head.position.y+0.02, headSize/2+0.01);
      const eyeR = new THREE.Mesh(eyeGeo, eyeMat); eyeR.position.set(headSize*0.22, head.position.y+0.02, headSize/2+0.01);
      group.add(eyeL); group.add(eyeR);
    }

    // patas
    this.legMeshes = [];
    if (isSpider) {
      for (let i=0;i<8;i++) {
        const legGeo = new THREE.BoxGeometry(0.06,0.3,0.06);
        const leg = new THREE.Mesh(legGeo, legMat);
        const side = i<4 ? -1:1;
        const idx = i%4;
        leg.position.set(side*(bodyW/2+0.1), 0.3, (idx-1.5)*0.18);
        group.add(leg); this.legMeshes.push(leg);
      }
    } else {
      const legCount = isChicken?2:4;
      const legGeo = new THREE.BoxGeometry(0.12, isChicken?0.35:0.5, 0.12);
      const positions = isChicken
        ? [[-0.08,0,0],[0.08,0,0]]
        : [[-bodyW/2+0.08,0,bodyD/2-0.08],[bodyW/2-0.08,0,bodyD/2-0.08],[-bodyW/2+0.08,0,-bodyD/2+0.08],[bodyW/2-0.08,0,-bodyD/2+0.08]];
      for (const p of positions) {
        const leg = new THREE.Mesh(legGeo, legMat);
        leg.position.set(p[0], (isChicken?0.18:0.25), p[2]);
        group.add(leg); this.legMeshes.push(leg);
      }
    }

    if (this.type===MOB_TYPE.CREEPER) {
      // creeper no tiene patas visibles separadas (piernas cortas pegadas al cuerpo), ajuste visual simple
      for (const leg of this.legMeshes) leg.scale.set(1,0.6,1);
    }

    return group;
  }

  get height() { return this.type===MOB_TYPE.SPIDER ? 0.6 : (this.type===MOB_TYPE.CHICKEN?0.5:0.9); }
  get width() { return this.type===MOB_TYPE.SPIDER ? 0.9 : 0.6; }

  isHostile() { return HOSTILE_MOBS.includes(this.type); }

  // === IA ===
  updateAI(dt, world, playerPos, onExplode, onAttackPlayer) {
    if (this.dead) return;
    const dx = playerPos.x-this.pos.x, dz = playerPos.z-this.pos.z;
    const distToPlayer = Math.sqrt(dx*dx+dz*dz);
    const cfg = this.cfg;

    if (this.isHostile()) {
      if (this.type === MOB_TYPE.CREEPER && this.state==='fuse') {
        this.fuseTimer += dt;
        if (this.fuseTimer >= cfg.fuseTime) {
          this.dead = true;
          if (onExplode) onExplode(this.pos.clone(), cfg.explosionRadius);
          return;
        }
      } else if (distToPlayer < cfg.detectRange) {
        this.state = 'chase';
      } else if (this.state==='chase' && distToPlayer > cfg.detectRange*1.5) {
        this.state = 'wander';
      }

      if (this.state === 'chase') {
        if (this.type===MOB_TYPE.CREEPER && distToPlayer < cfg.attackRange) {
          this.state = 'fuse'; this.fuseTimer = 0;
        } else if (this.type===MOB_TYPE.SKELETON && distToPlayer < cfg.attackRange && distToPlayer > 3) {
          // skeleton mantiene distancia: no avanza más si ya está en rango de tiro
          this.yaw = Math.atan2(dx, dz);
        } else if (distToPlayer > cfg.attackRange*0.7) {
          this.yaw = Math.atan2(dx, dz);
          this.moveForward(dt, world, cfg.speed);
        }
        if (distToPlayer < cfg.attackRange && this.type!==MOB_TYPE.CREEPER) {
          this.attackCooldown -= dt;
          if (this.attackCooldown <= 0) {
            this.attackCooldown = 1.0;
            if (onAttackPlayer) onAttackPlayer(cfg.damage);
          }
        }
      } else {
        this.wander(dt, world);
      }
    } else {
      // animales: deambulan pasivamente, huyen si el jugador está muy cerca (opcional simple)
      this.wander(dt, world);
    }

    this.applyGravityAndCollision(dt, world);
    this.animateWalk(dt);
  }

  wander(dt, world) {
    this.stateTimer -= dt;
    if (this.stateTimer <= 0 || !this.wanderTarget) {
      this.stateTimer = 3+Math.random()*4;
      this.yaw = Math.random()*Math.PI*2;
    }
    if (Math.random() < 0.6*dt) this.moveForward(dt, world, this.cfg.speed*0.5);
  }

  moveForward(dt, world, speed) {
    const dx = Math.sin(this.yaw)*speed*dt;
    const dz = Math.cos(this.yaw)*speed*dt;
    const nx = this.pos.x+dx, nz = this.pos.z+dz;
    // no caminar hacia un bloque sólido (evita que atraviesen paredes, aunque IA simple)
    if (!world.isSolidAt(Math.floor(nx), Math.floor(this.pos.y), Math.floor(nz))) {
      this.pos.x = nx; this.pos.z = nz;
    } else {
      this.yaw += Math.PI/2; // gira si choca
    }
  }

  applyGravityAndCollision(dt, world) {
    this.vel.y += GRAVITY*dt;
    const nextY = this.pos.y + this.vel.y*dt;
    if (world.isSolidAt(Math.floor(this.pos.x), Math.floor(nextY), Math.floor(this.pos.z))) {
      if (this.vel.y < 0) { this.onGround = true; this.pos.y = Math.ceil(nextY); }
      this.vel.y = 0;
    } else {
      this.pos.y = nextY;
      this.onGround = false;
    }
  }

  animateWalk(dt) {
    this._walkCycle = (this._walkCycle||0) + dt*6;
    const swing = Math.sin(this._walkCycle)*0.4;
    for (let i=0;i<this.legMeshes.length;i++) {
      this.legMeshes[i].rotation.x = (i%2===0?1:-1)*swing;
    }
    this.group.position.copy(this.pos);
    this.group.rotation.y = this.yaw;
  }

  takeDamage(amount) {
    this.health -= amount;
    if (this.health <= 0) this.dead = true;
    return this.dead;
  }

  destroy() {
    this.scene.remove(this.group);
    this.group.traverse(obj => { if (obj.geometry) obj.geometry.dispose(); if (obj.material) obj.material.dispose(); });
  }
}

/* =====================================================================
   SISTEMA: MOB MANAGER
   Controla spawn (más agresivo de noche para hostiles), límite de mobs
   activos por rendimiento, y el ciclo update/destroy.
   ===================================================================== */
class MobManager {
  constructor(scene, world, droppedItems) {
    this.scene = scene;
    this.world = world;
    this.droppedItems = droppedItems;
    this.mobs = [];
    this.maxHostiles = 12;
    this.maxAnimals = 10;
    this.spawnTimer = 0;
  }

  countByCategory() {
    let hostiles=0, animals=0;
    for (const m of this.mobs) { if (m.isHostile()) hostiles++; else animals++; }
    return {hostiles, animals};
  }

  trySpawn(playerPos, isNight) {
    const {hostiles, animals} = this.countByCategory();
    const wantHostile = isNight && hostiles < this.maxHostiles;
    const wantAnimal = animals < this.maxAnimals;
    if (!wantHostile && !wantAnimal) return;

    // posición candidata: anillo alrededor del jugador, fuera de la vista inmediata pero dentro de chunks cargados
    const ang = Math.random()*Math.PI*2;
    const dist = 14 + Math.random()*16;
    const wx = Math.floor(playerPos.x + Math.cos(ang)*dist);
    const wz = Math.floor(playerPos.z + Math.sin(ang)*dist);
    // buscar superficie sólida en esa columna (desde arriba hacia abajo, límite razonable)
    let spawnY = -1;
    for (let y=Math.min(WORLD_HEIGHT-2, 60); y>1; y--) {
      if (this.world.isSolidAt(wx,y,wz) && !this.world.isSolidAt(wx,y+1,wz) && !this.world.isSolidAt(wx,y+2,wz)) {
        // comprobar que ni el bloque de superficie ni el espacio donde aparecerá el mob sean agua
        const surfaceBlock = this.world.getBlock(wx,y,wz);
        const spawnSpaceBlock = this.world.getBlock(wx,y+1,wz);
        if (surfaceBlock === BLOCK.WATER || spawnSpaceBlock === BLOCK.WATER) continue;
        spawnY = y+1; break;
      }
    }
    if (spawnY < 0) return; // no se encontró superficie válida (chunk no cargado, agua, o cueva compleja)

    let type;
    if (wantHostile && (!wantAnimal || Math.random()<0.5)) {
      type = HOSTILE_MOBS[Math.floor(Math.random()*HOSTILE_MOBS.length)];
    } else {
      type = ANIMAL_MOBS[Math.floor(Math.random()*ANIMAL_MOBS.length)];
    }
    const mob = new Mob(this.scene, type, new THREE.Vector3(wx+0.5, spawnY, wz+0.5));
    this.mobs.push(mob);
  }

  update(dt, playerPos, isNight, callbacks) {
    this.spawnTimer -= dt;
    if (this.spawnTimer <= 0) {
      this.spawnTimer = 2 + Math.random()*3;
      this.trySpawn(playerPos, isNight);
    }
    for (let i=this.mobs.length-1; i>=0; i--) {
      const mob = this.mobs[i];
      // despawn por lejanía (rendimiento) — pero solo si sigue vivo; un mob que
      // acaba de morir debe procesar su drop antes de ser eliminado, aunque el
      // jugador ya esté lejos, para no perder el loot silenciosamente.
      if (!mob.dead) {
        const dx=mob.pos.x-playerPos.x, dz=mob.pos.z-playerPos.z;
        if (dx*dx+dz*dz > 80*80) { mob.destroy(); this.mobs.splice(i,1); continue; }
      }

      if (!mob.dead) {
        mob.updateAI(dt, this.world, playerPos, callbacks.onExplode, (dmg) => {
          const dx2=mob.pos.x-playerPos.x, dz2=mob.pos.z-playerPos.z;
          if (dx2*dx2+dz2*dz2 < (mob.cfg.attackRange+0.5)*(mob.cfg.attackRange+0.5)) {
            if (callbacks.onPlayerHit) callbacks.onPlayerHit(dmg);
          }
        });
      }

      if (mob.dead) {
        // dropear items al morir
        for (const dropDef of mob.cfg.drops) {
          const count = Array.isArray(dropDef.count) ? (dropDef.count[0]+Math.floor(Math.random()*(dropDef.count[1]-dropDef.count[0]+1))) : dropDef.count;
          this.droppedItems.spawnDrop(mob.pos.clone(), dropDef.item, count);
        }
        mob.destroy();
        this.mobs.splice(i,1);
      }
    }
  }

  // daño en área (usado por la explosión del creeper)
  damageInRadius(center, radius, playerPos, onPlayerDamaged) {
    const distToPlayerSq = (center.x-playerPos.x)**2 + (center.y-playerPos.y)**2 + (center.z-playerPos.z)**2;
    if (distToPlayerSq < radius*radius) {
      const falloff = 1 - Math.sqrt(distToPlayerSq)/radius;
      const dmg = Math.ceil(6*falloff);
      if (dmg > 0 && onPlayerDamaged) onPlayerDamaged(dmg);
    }
    for (const mob of this.mobs) {
      const d2 = (center.x-mob.pos.x)**2 + (center.y-mob.pos.y)**2 + (center.z-mob.pos.z)**2;
      if (d2 < radius*radius) {
        const falloff = 1 - Math.sqrt(d2)/radius;
        mob.takeDamage(Math.ceil(8*falloff));
      }
    }
  }
}


const Game = {
  started:false,
  fpsAccum:0, fpsFrames:0, fpsLast:0,
  inventory:null,
  hotbarSelected:0,
  health:20, maxHealth:20, // 10 corazones = 20 puntos (medio corazón = 1 punto)
  hunger:20, maxHunger:20,
  dead:false,
  invOpen:false,
  droppedItems:null,
  targetBlock:null, // {x,y,z,face,dist}
  miningProgress:0,
  miningTarget:null, // "x,y,z" string del bloque que se está minando actualmente
  craftGrid2:null, craftGrid3:null, // arrays de 4 / 9 slots {item,count}|null
  furnace:null, // {input,fuel,output,fuelBurnTime,fuelBurnMax,cookProgress,cookMax}
  lastPlaceTime:0, lastBreakActionTime:0,

  async startSingleplayer() {
    document.getElementById('mainMenu').style.display = 'none';
    const loading = document.getElementById('loadingScreen');
    loading.style.display = 'flex';
    const bar = document.getElementById('loadingBarInner');
    const txt = document.getElementById('loadingText');
    try {
      if (typeof THREE === 'undefined') {
        throw new Error('Three.js no cargó (CDN bloqueado o sin conexión a internet). Revisa tu conexión y recarga la página.');
      }
      registerBlocks();
      registerItems();
      registerFurnaceRecipes();
      registerFuelValues();
      Engine.init();
      this.inventory = new Inventory(36); // 27 principal + 9 hotbar (índices 27-35 = hotbar)
      this.craftGrid2 = new Array(4).fill(null);
      this.craftGrid3 = new Array(9).fill(null);
      this.furnace = { input:null, fuel:null, output:null, fuelBurnTime:0, fuelBurnMax:0, cookProgress:0, cookMax:10 };
      // kit inicial básico para poder empezar a jugar/testear progresión
      this.inventory.addItem(ITEM.WOOD_PICKAXE, 1);
      this.inventory.addItem(ITEM.WOOD_AXE, 1);

      txt.textContent = 'Generando terreno con ruido simplex...';
      const startTime = performance.now();
      const timeoutGuard = setTimeout(() => {
        if (!this.started) {
          txt.style.color = '#ff6666';
          txt.textContent = 'La generación está tardando demasiado. Prueba recargar la página o revisa la consola (F12).';
        }
      }, 25000);
      await Engine.pregenerateSpawnArea(p => {
        bar.style.width = Math.floor(p*100)+'%';
        txt.textContent = 'Generando terreno... ' + Math.floor(p*100)+'%';
      });
      clearTimeout(timeoutGuard);
      console.log('[MINICRAFT] Generación inicial completada en', ((performance.now()-startTime)/1000).toFixed(1), 's');
      this.droppedItems = new DroppedItemsManager(Engine.scene, Engine.world);
      this.mobManager = new MobManager(Engine.scene, Engine.world, this.droppedItems);

      loading.style.display = 'none';
      document.getElementById('hud').style.display = 'block';
      UI.rebuildHotbar();
      UI.rebuildHealthHunger();
      if (Engine.isMobile) {
        document.getElementById('mobileControls').style.display = 'block';
      } else {
        document.getElementById('startPrompt').style.display = 'flex';
      }
      this.started = true;
      this.loop();
    } catch (err) {
      console.error('[MINICRAFT] Error al iniciar:', err);
      txt.style.color = '#ff6666';
      txt.textContent = 'ERROR: ' + err.message + ' (revisa la consola con F12 para más detalles)';
      bar.style.background = '#aa2222';
    }
  },

  handleInputAndPhysics(dt) {
    if (this.invOpen || this.dead) return; // congelar movimiento con inventario/muerte
    const camYaw = Engine.isMobile ? Engine.mobileInput.yaw : Engine.input.yaw;
    const camPitch = Engine.isMobile ? Engine.mobileInput.pitch : Engine.input.pitch;
    let moveX=0, moveZ=0, jump=false, sprint=false;
    if (Engine.isMobile) {
      moveX = Engine.mobileInput.moveX;
      moveZ = Engine.mobileInput.moveZ;
      jump = Engine.mobileInput.jump;
      sprint = Engine.mobileInput.run;
    } else {
      const mv = Engine.input.getMoveVector();
      moveX = mv.x; moveZ = mv.z;
      jump = Engine.input.isDown('Space');
      sprint = Engine.input.isDown('ShiftLeft') || Engine.input.isDown('ShiftRight');
      Engine.crouching = Engine.input.isDown('ControlLeft') || Engine.input.isDown('KeyC');
    }
    const wasOnGroundBefore = Engine.physics.onGround;
    const yBefore = Engine.physics.pos.y;
    Engine.physics.update(dt, { moveX, moveZ, jump, sprint, yaw:camYaw }, Engine.crouching);

    // daño por caída: si tocó el suelo viniendo de una velocidad de caída alta
    if (!wasOnGroundBefore && Engine.physics.onGround) {
      const fallDist = Math.max(0, yBefore - Engine.physics.pos.y);
      if (fallDist > 3.5) {
        const dmg = Math.floor((fallDist-3)*1.2);
        if (dmg > 0) this.damagePlayer(dmg);
      }
    }
    // daño por ahogamiento simplificado: si está sumergido bajo agua por mucho tiempo
    const headBlock = Engine.world.getBlock(Math.floor(Engine.physics.pos.x), Math.floor(Engine.physics.pos.y+1.6), Math.floor(Engine.physics.pos.z));
    if (headBlock === BLOCK.WATER) {
      this._underwaterTime = (this._underwaterTime||0) + dt;
      if (this._underwaterTime > 8) {
        this.damagePlayer(1);
        this._underwaterTime = 6.5; // daño periódico, no cada frame
      }
    } else {
      this._underwaterTime = 0;
    }

    // cámara sigue al jugador (ojos a ~90% de la altura)
    const eyeHeight = Engine.crouching ? PLAYER_HEIGHT_CROUCH*0.9 : PLAYER_HEIGHT_STAND*0.9;
    Engine.camera.position.set(Engine.physics.pos.x, Engine.physics.pos.y+eyeHeight, Engine.physics.pos.z);
    Engine.camera.rotation.order = 'YXZ';
    Engine.camera.rotation.y = camYaw;
    Engine.camera.rotation.x = camPitch;
  },

  // ===== INTERACCIÓN: raycast + minar + colocar =====
  updateBlockTargeting(dt) {
    if (this.invOpen || this.dead) { this.targetBlock = null; this.miningTarget = null; return; }
    const dir = new THREE.Vector3();
    Engine.camera.getWorldDirection(dir);
    const origin = Engine.camera.position;
    const result = raycastBlocks(Engine.world, origin, dir, MAX_REACH);
    this.targetBlock = result.hit ? result : null;
    const blockHitDist = result.hit ? result.dist : Infinity;

    const isMining = Engine.isMobile ? Engine.mobileInput.breakHeld : Engine.input.mouseDownLeft;

    // detectar mob apuntado: proyección simple del mob sobre el rayo de la cámara,
    // solo cuenta si está más cerca que cualquier bloque sólido en esa dirección.
    let targetedMob = null, targetedMobDist = Infinity;
    if (this.mobManager) {
      for (const mob of this.mobManager.mobs) {
        const toMob = new THREE.Vector3(mob.pos.x-origin.x, mob.pos.y+mob.height/2-origin.y, mob.pos.z-origin.z);
        const dist = toMob.length();
        if (dist > MAX_REACH || dist >= blockHitDist) continue;
        const toMobNorm = toMob.clone().normalize();
        const dot = toMobNorm.x*dir.x + toMobNorm.y*dir.y + toMobNorm.z*dir.z;
        if (dot > 0.95 && dist < targetedMobDist) { targetedMob = mob; targetedMobDist = dist; }
      }
    }

    if (targetedMob && isMining) {
      this._mobAttackCooldown = (this._mobAttackCooldown||0) - dt;
      if (this._mobAttackCooldown <= 0) {
        this._mobAttackCooldown = 0.4;
        const selectedItem = this.getSelectedItem();
        const toolData = selectedItem && typeof selectedItem.item === 'string' ? ItemData[selectedItem.item] : null;
        const dmg = (toolData && toolData.tool) ? toolData.tool.attackDamage : 1;
        targetedMob.takeDamage(dmg);
      }
      this.miningTarget = null; this.miningProgress = 0;
      Engine.input.placeRequested = false;
      return; // priorizar combate sobre minado este frame
    }

    if (this.targetBlock && isMining) {
      const key = this.targetBlock.x+','+this.targetBlock.y+','+this.targetBlock.z;
      if (this.miningTarget !== key) { this.miningTarget = key; this.miningProgress = 0; }
      const blockId = Engine.world.getBlock(this.targetBlock.x,this.targetBlock.y,this.targetBlock.z);
      const bd = BlockData[blockId];
      if (bd && bd.hardness < 0) { /* bedrock: irrompible */ }
      else if (bd) {
        const selectedItem = this.getSelectedItem();
        const toolData = selectedItem && typeof selectedItem.item === 'string' ? ItemData[selectedItem.item] : null;
        const tool = toolData ? toolData.tool : null;
        let speedMul = 1.0;
        // Solo el PICO es estricto: bloques que requieren pico (mena/piedra) NO se
        // pueden recoger sin el tier correcto (ej. diamante nunca se consigue a mano).
        // Pala/hacha/otras son solo "herramienta óptima": sin ellas se puede igual,
        // solo más lento, y sí se obtiene el drop (grass/dirt a mano funciona).
        let canHarvest;
        if (bd.tool === 'pickaxe') {
          canHarvest = !!(tool && tool.type === 'pickaxe' && ((bd.tier===undefined) || (tool.tier >= bd.tier)));
          speedMul = canHarvest ? tool.speedMul : 0.3;
        } else {
          canHarvest = true; // dirt, grass, madera, etc. siempre se pueden recoger, a mano o con herramienta
          if (tool && tool.type === bd.tool) speedMul = tool.speedMul;
          else if (bd.tool) speedMul = 0.5; // sin la herramienta óptima: más lento, pero igual se consigue
        }
        const timeNeeded = Math.max(0.05, bd.hardness / speedMul);
        this.miningProgress += dt;
        if (this.miningProgress >= timeNeeded) {
          this.breakTargetedBlock(this.targetBlock.x, this.targetBlock.y, this.targetBlock.z, blockId, canHarvest, tool);
          this.miningProgress = 0; this.miningTarget = null;
        }
      }
    } else {
      this.miningTarget = null; this.miningProgress = 0;
    }

    // colocar bloque O interactuar con bloque especial (mesa de crafteo / horno)
    const placeRequested = Engine.isMobile ? this._mobilePlaceEdge() : Engine.input.placeRequested;
    if (placeRequested && this.targetBlock) {
      const lookedBlockId = Engine.world.getBlock(this.targetBlock.x, this.targetBlock.y, this.targetBlock.z);
      if (lookedBlockId === BLOCK.CRAFTING_TABLE) {
        UI.openCraftingTable();
      } else if (lookedBlockId === BLOCK.FURNACE) {
        UI.openFurnace();
      } else {
        this.placeBlockFromHotbar();
      }
    }
    Engine.input.placeRequested = false;
  },

  _mobilePlaceEdge() {
    const now = Engine.mobileInput.placeHeld;
    const wasPressed = now && !this._mobilePlacePrev;
    this._mobilePlacePrev = now;
    return wasPressed;
  },

  breakTargetedBlock(x,y,z, blockId, canHarvest, tool) {
    const bd = BlockData[blockId];
    Engine.world.setBlock(x,y,z, BLOCK.AIR);
    if (canHarvest && bd.drop !== null && bd.drop !== undefined) {
      const dropItem = bd.drop;
      const dropCount = (blockId===BLOCK.COAL_ORE) ? 1 : ((blockId===BLOCK.DIAMOND_ORE) ? 1 : 1);
      this.droppedItems.spawnDrop(new THREE.Vector3(x+0.5,y+0.4,z+0.5), dropItem, dropCount);
    }
    // gasta durabilidad de la herramienta usada
    if (tool) {
      tool.durability -= 1;
      if (tool.durability <= 0) {
        // romper herramienta: quitar del slot seleccionado
        const idx = this.getSelectedSlotIndex();
        this.inventory.slots[idx] = null;
        UI.rebuildHotbar();
      }
    }
  },

  getSelectedSlotIndex() { return 27 + this.hotbarSelected; }, // hotbar ocupa índices 27..35
  getSelectedItem() { return this.inventory.slots[this.getSelectedSlotIndex()]; },

  placeBlockFromHotbar() {
    const slot = this.getSelectedItem();
    if (!slot) return;
    if (typeof slot.item !== 'number') return; // solo bloques son colocables
    const bd = BlockData[slot.item];
    if (!bd) return;
    const tb = this.targetBlock;
    const px = tb.x + (tb.face?tb.face[0]:0);
    const py = tb.y + (tb.face?tb.face[1]:0);
    const pz = tb.z + (tb.face?tb.face[2]:0);
    // no colocar dentro de otro bloque sólido, ni dentro del jugador, ni fuera de alcance (ya limitado por MAX_REACH del raycast)
    if (Engine.world.isSolidAt(px,py,pz)) return;
    if (wouldOverlapPlayer(Engine.physics.pos, Engine.physics.height, px,py,pz)) return;
    Engine.world.setBlock(px,py,pz, slot.item);
    slot.count -= 1;
    if (slot.count <= 0) this.inventory.slots[this.getSelectedSlotIndex()] = null;
    UI.rebuildHotbar();
  },

  damagePlayer(amount) {
    if (this.dead) return;
    this.health = Math.max(0, this.health - amount);
    UI.rebuildHealthHunger();
    if (this.health <= 0) this.onPlayerDeath();
  },
  onPlayerDeath() {
    this.dead = true;
    document.getElementById('deathScreen').style.display = 'flex';
    if (document.pointerLockElement) document.exitPointerLock();
  },
  respawn() {
    const spawn = findSafeSpawnNear(Engine.world, Engine.physics.pos.x, Engine.physics.pos.z);
    Engine.physics.pos.copy(spawn);
    Engine.physics.vel.set(0,0,0);
    this.health = this.maxHealth;
    this.hunger = Math.max(6, this.hunger);
    this.dead = false;
    document.getElementById('deathScreen').style.display = 'none';
    UI.rebuildHealthHunger();
  },

  updateHunger(dt) {
    this._hungerTimer = (this._hungerTimer||0) + dt;
    if (this._hungerTimer > 12) { // cada ~12s de juego pierde algo de hambre (ritmo jugable, no realista-lento)
      this._hungerTimer = 0;
      this.hunger = Math.max(0, this.hunger - 1);
      UI.rebuildHealthHunger();
      if (this.hunger <= 0) {
        this._starveTimer = (this._starveTimer||0) + 1;
        if (this._starveTimer % 3 === 0) this.damagePlayer(1); // inanición hace daño lento
      }
    }
  },

  updateHUDInfo() {
    const p = Engine.physics.pos;
    document.getElementById('topLeftInfo').innerHTML =
      `X: ${p.x.toFixed(1)} Y: ${p.y.toFixed(1)} Z: ${p.z.toFixed(1)}<br>FPS: ${Game.fpsLast}`;
  },

  loop() {
    const dt = Math.min(0.05, Engine.clock.getDelta());
    this.fpsAccum += dt; this.fpsFrames++;
    if (this.fpsAccum >= 0.5) { this.fpsLast = Math.round(this.fpsFrames/this.fpsAccum); this.fpsAccum=0; this.fpsFrames=0; }

    const dayFactor = Engine.updateDayNight(dt);
    const isNight = dayFactor < 0.15;
    this.handleInputAndPhysics(dt);
    if (!this.invOpen && !this.dead) {
      this.updateBlockTargeting(dt);
      this.updateHunger(dt);
      this.droppedItems.update(dt, Engine.physics.pos, this.inventory, ()=>UI.rebuildHotbar());
      if (this.mobManager) {
        this.mobManager.update(dt, Engine.physics.pos, isNight, {
          onExplode: (center, radius) => {
            this.mobManager.damageInRadius(center, radius, Engine.physics.pos, (dmg) => this.damagePlayer(dmg));
          },
          onPlayerHit: (dmg) => this.damagePlayer(dmg)
        });
      }
    }
    if (this.furnace) {
      FurnaceSystem.update(this.furnace, dt, () => {
        if (document.getElementById('furnaceScreen').style.display==='flex') UI.rebuildFurnaceScreen();
      });
    }
    Engine.chunkManager.ensureAround(Engine.physics.pos.x, Engine.physics.pos.z);
    Engine.chunkManager.processQueue(2);
    this.updateHUDInfo();
    UI.updateCrosshairOutline();

    Engine.renderer.render(Engine.scene, Engine.camera);
    requestAnimationFrame(() => this.loop());
  }
};

/* =====================================================================
   UI BOOTSTRAP — menú principal, opciones, arranque
   ===================================================================== */
window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('btnPlaySolo').addEventListener('click', () => Game.startSingleplayer());
  document.getElementById('btnShowMP').addEventListener('click', () => {
    document.getElementById('menuMain').style.display='none';
    document.getElementById('mpPanel').style.display='flex';
  });
  document.getElementById('btnBackFromMP').addEventListener('click', () => {
    document.getElementById('mpPanel').style.display='none';
    document.getElementById('menuMain').style.display='flex';
  });
  document.getElementById('btnShowOpt').addEventListener('click', () => {
    document.getElementById('menuMain').style.display='none';
    document.getElementById('optPanel').style.display='flex';
  });
  document.getElementById('btnBackFromOpt').addEventListener('click', () => {
    document.getElementById('optPanel').style.display='none';
    document.getElementById('menuMain').style.display='flex';
  });
  document.getElementById('startPrompt').addEventListener('click', () => {
    document.getElementById('gameCanvas').requestPointerLock();
    document.getElementById('startPrompt').style.display='none';
  });
  document.addEventListener('pointerlockchange', () => {
    // Solo mostrar el prompt de "click para jugar" si el mouse se liberó
    // por accidente/Esc del usuario mientras NO hay ningún panel (inventario,
    // mesa de crafteo, horno, muerte) abierto intencionalmente.
    const anyPanelOpen = Game.invOpen || Game.dead;
    if (document.pointerLockElement !== document.getElementById('gameCanvas') && Game.started && !Engine.isMobile && !anyPanelOpen) {
      document.getElementById('startPrompt').style.display='flex';
    }
  });
  document.getElementById('sensSlider').addEventListener('input', e => {
    if (Engine.input) Engine.input.sensitivity = parseFloat(e.target.value);
  });
  document.getElementById('renderDistSlider').addEventListener('input', e => {
    if (Engine.chunkManager) Engine.chunkManager.renderDistance = parseInt(e.target.value);
  });
  document.getElementById('btnRespawn').addEventListener('click', () => Game.respawn());
  document.getElementById('btnInv').addEventListener('touchstart', e => { e.preventDefault(); if(Game.started) UI.toggleInventory(); });

  window.addEventListener('keydown', e => {
    if (!Game.started || Game.dead) return;
    if (e.code === 'KeyE') {
      const anySubPanelOpen = document.getElementById('craftingTableScreen').style.display==='flex'
        || document.getElementById('furnaceScreen').style.display==='flex';
      if (anySubPanelOpen) {
        // cerrar el panel específico que esté abierto
        if (document.getElementById('craftingTableScreen').style.display==='flex') UI.closeCraftingTable();
        else UI.closeFurnace();
      } else {
        UI.toggleInventory();
      }
    }
    if (e.code >= 'Digit1' && e.code <= 'Digit9' && !Game.invOpen) {
      Game.hotbarSelected = parseInt(e.code.replace('Digit',''))-1;
      UI.rebuildHotbar();
    }
  });

  console.log('[MINICRAFT] UI lista.');
});
</script>
