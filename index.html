<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BLOXVERSE</title>

<style>
*{
 box-sizing:border-box;
 margin:0;
 padding:0;
}

html,body{
 width:100%;
 height:100%;
 overflow:hidden;
 font-family:Arial,Segoe UI,sans-serif;
 background:#080c16;
 color:white;
}

button,input{
 font:inherit;
}

.screen{
 position:absolute;
 inset:0;
 display:none;
}

.screen.active{
 display:flex;
}

/* ================= LOGIN ================= */

#loginScreen{
 align-items:center;
 justify-content:center;
 flex-direction:column;
 background:
 radial-gradient(circle at 20% 20%,#173b58 0,#0a1020 35%,#05070d 100%);
}

.logo{
 font-size:52px;
 font-weight:900;
 letter-spacing:4px;
 color:#00d9ff;
 text-shadow:0 0 25px #00d9ff55;
}

.logo span{
 color:#ff3d7f;
}

.subtitle{
 margin-top:6px;
 color:#8993b3;
 letter-spacing:2px;
 font-size:13px;
 margin-bottom:30px;
}

.loginCard{
 width:360px;
 padding:30px;
 border-radius:18px;
 background:#12182a;
 border:1px solid #2c375d;
 box-shadow:0 25px 70px #0009;
}

.loginCard h2{
 text-align:center;
 margin-bottom:18px;
}

.input{
 width:100%;
 padding:13px;
 margin-bottom:12px;
 border-radius:9px;
 border:1px solid #303b63;
 outline:none;
 background:#080d1b;
 color:white;
}

.input:focus{
 border-color:#00d9ff;
}

.btn{
 width:100%;
 padding:13px;
 border:none;
 border-radius:9px;
 background:linear-gradient(90deg,#00d9ff,#009cff);
 color:#00121a;
 font-weight:800;
 cursor:pointer;
}

.btn:hover{
 filter:brightness(1.1);
}

.error{
 min-height:18px;
 text-align:center;
 color:#ff6487;
 font-size:13px;
 margin-top:10px;
}

/* ================= LOBBY ================= */

#lobbyScreen{
 flex-direction:column;
 background:linear-gradient(#090d18,#131a2d);
}

#topbar{
 min-height:64px;
 display:flex;
 align-items:center;
 gap:10px;
 padding:10px 22px;
 background:#080c16ee;
 border-bottom:1px solid #293555;
 flex-wrap:wrap;
}

#topbar .logo{
 font-size:22px;
 margin-right:auto;
}

.nav{
 background:transparent;
 border:1px solid #303b63;
 color:#bfc7e4;
 padding:8px 14px;
 border-radius:8px;
 cursor:pointer;
}

.nav.active{
 color:#00d9ff;
 border-color:#00d9ff;
 background:#00d9ff12;
}

#userInfo{
 display:flex;
 align-items:center;
 gap:10px;
 margin-left:8px;
}

#coins{
 color:#ffd700;
 font-weight:800;
}

#avatarSmall{
 width:34px;
 height:34px;
 border-radius:50%;
 display:flex;
 align-items:center;
 justify-content:center;
 background:linear-gradient(135deg,#00d9ff,#ff3d7f);
 font-weight:900;
}

.tab{
 display:none;
 flex:1;
 overflow:auto;
 padding:28px;
}

.tab.active{
 display:block;
}

/* ================= JUEGOS ================= */

#gameGrid{
 max-width:1100px;
 margin:auto;
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
 gap:20px;
}

.gameCard{
 background:#141a2d;
 border:1px solid #303b63;
 border-radius:15px;
 overflow:hidden;
 cursor:pointer;
 transition:.2s;
}

.gameCard:hover{
 transform:translateY(-5px);
 border-color:#00d9ff;
}

.gameImage{
 height:150px;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:60px;
}

.gameBody{
 padding:16px;
}

.gameBody h3{
 margin-bottom:7px;
}

.gameBody p{
 color:#8e97b6;
 font-size:13px;
 line-height:1.5;
}

.playTag{
 display:inline-block;
 margin-top:12px;
 color:#00d9ff;
 font-size:12px;
 font-weight:bold;
}

/* ================= AVATAR ================= */

.avatarWrap{
 max-width:1000px;
 margin:auto;
 display:flex;
 gap:30px;
 flex-wrap:wrap;
}

.avatarPreview{
 width:350px;
 height:440px;
 background:#101629;
 border:1px solid #303b63;
 border-radius:16px;
}

.avatarControls{
 flex:1;
 min-width:280px;
}

.group{
 margin-bottom:20px;
}

.group h4{
 color:#c5cce5;
 margin-bottom:10px;
 font-size:13px;
 text-transform:uppercase;
 letter-spacing:1px;
}

.colors{
 display:flex;
 gap:9px;
 flex-wrap:wrap;
}

.color{
 width:35px;
 height:35px;
 border-radius:50%;
 border:2px solid transparent;
 cursor:pointer;
}

.color.selected{
 border-color:white;
 box-shadow:0 0 0 2px #00d9ff;
}

.accessory{
 width:70px;
 height:45px;
 border:1px solid #303b63;
 border-radius:8px;
 background:#11182a;
 color:white;
 cursor:pointer;
}

.accessory.selected{
 border-color:#00d9ff;
 color:#00d9ff;
}

/* ================= MARKET ================= */

#marketGrid{
 max-width:1100px;
 margin:auto;
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
 gap:18px;
}

.item{
 background:#141a2d;
 border:1px solid #303b63;
 border-radius:14px;
 padding:14px;
}

.itemPreview{
 height:130px;
 border-radius:9px;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:50px;
 margin-bottom:12px;
}

.item h3{
 margin-bottom:5px;
}

.price{
 color:#ffd700;
 font-weight:bold;
}

.buy{
 margin-top:10px;
 width:100%;
 padding:9px;
 border-radius:7px;
 border:1px solid #00d9ff;
 background:#00d9ff15;
 color:#00d9ff;
 cursor:pointer;
}

/* ================= GAME ================= */

#gameScreen{
 background:#87ceeb;
}

#gameCanvas{
 width:100%;
 height:100%;
 display:block;
}

#gameHud{
 position:absolute;
 top:15px;
 left:15px;
 right:15px;
 display:flex;
 justify-content:space-between;
 pointer-events:none;
}

.hud{
 background:#090f1dcc;
 border:1px solid #394668;
 border-radius:9px;
 padding:9px 14px;
}

#exitGame{
 position:absolute;
 top:65px;
 right:15px;
 background:#10182acc;
 color:white;
 border:1px solid #394668;
 border-radius:8px;
 padding:9px 14px;
 cursor:pointer;
}

#roomInfo{
 position:absolute;
 bottom:18px;
 left:18px;
 background:#090f1dcc;
 border:1px solid #394668;
 border-radius:9px;
 padding:10px 14px;
 color:#aeb7d2;
}

#mobileControls{
 display:none;
 position:absolute;
 bottom:20px;
 left:20px;
 right:20px;
 justify-content:space-between;
}

.mobileBtn{
 width:60px;
 height:60px;
 border-radius:50%;
 background:#ffffff35;
 border:2px solid #ffffff88;
 color:white;
 font-size:22px;
}

/* ================= RESPONSIVE ================= */

@media(max-width:700px){

 .logo{
  font-size:36px;
 }

 .loginCard{
  width:90%;
 }

 #topbar .logo{
  width:100%;
 }

 .avatarPreview{
  width:100%;
 }

 #mobileControls{
  display:flex;
 }
}
</style>
</head>

<body>

<!-- LOGIN -->

<section id="loginScreen" class="screen active">

 <div class="logo">
  BLOX<span>VERSE</span>
 </div>

 <div class="subtitle">
  MINIJUEGOS 3D MULTIJUGADOR
 </div>

 <div class="loginCard">

  <h2>Entrar a BLOXVERSE</h2>

  <input
   id="username"
   class="input"
   maxlength="16"
   placeholder="Nombre de usuario">

  <input
   id="password"
   class="input"
   type="password"
   placeholder="Contraseña">

  <button
   id="loginButton"
   class="btn">
   ENTRAR / REGISTRARSE
  </button>

  <div id="loginError" class="error"></div>

 </div>

</section>


<!-- LOBBY -->

<section id="lobbyScreen" class="screen">

 <div id="topbar">

  <div class="logo">
   BLOX<span>VERSE</span>
  </div>

  <button class="nav active" data-tab="games">
   🎮 JUEGOS
  </button>

  <button class="nav" data-tab="avatar">
   🧍 AVATAR
  </button>

  <button class="nav" data-tab="market">
   🛒 MARKETPLACE
  </button>

  <div id="userInfo">

   <span id="coins">
    🪙 20 YEIBUX
   </span>

   <div id="avatarSmall">
    ?
   </div>

   <span id="usernameDisplay"></span>

  </div>

 </div>


 <!-- JUEGOS -->

 <div id="tab-games" class="tab active">

  <div id="gameGrid"></div>

 </div>


 <!-- AVATAR -->

 <div id="tab-avatar" class="tab">

  <div class="avatarWrap">

   <canvas
    id="avatarCanvas"
    class="avatarPreview">
   </canvas>

   <div class="avatarControls">

    <div class="group">

     <h4>
      Color de piel
     </h4>

     <div
      id="skinColors"
      class="colors">
     </div>

    </div>


    <div class="group">

     <h4>
      Camisa
     </h4>

     <div
      id="shirtColors"
      class="colors">
     </div>

    </div>


    <div class="group">

     <h4>
      Pantalón
     </h4>

     <div
      id="pantsColors"
      class="colors">
     </div>

    </div>


    <div class="group">

     <h4>
      Accesorios 3D
     </h4>

     <div id="accessories"></div>

    </div>


    <button
     id="saveAvatar"
     class="btn">
     💾 GUARDAR AVATAR
    </button>

   </div>

  </div>

 </div>


 <!-- MARKET -->

 <div id="tab-market" class="tab">

  <div id="marketGrid"></div>

 </div>

</section>


<!-- JUEGO -->

<section id="gameScreen" class="screen">

 <canvas id="gameCanvas"></canvas>

 <div id="gameHud">

  <div
   id="hudLeft"
   class="hud">
   Jugadores: 1
  </div>

  <div
   id="hudRight"
   class="hud">
   00:00
  </div>

 </div>

 <button id="exitGame">
  ← SALIR
 </button>

 <div id="roomInfo">
  Sala pública
 </div>

 <div id="mobileControls">

  <button
   id="mobileLeft"
   class="mobileBtn">
   ◀
  </button>

  <button
   id="mobileJump"
   class="mobileBtn">
   ▲
  </button>

  <button
   id="mobileRight"
   class="mobileBtn">
   ▶
  </button>

 </div>

</section>


<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script type="module">

import {
 initializeApp
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";

import {
 getAuth,
 createUserWithEmailAndPassword,
 signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

import {
 getFirestore,
 doc,
 getDoc,
 setDoc,
 collection,
 getDocs,
 onSnapshot
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";


/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig = {

 apiKey:
 "AIzaSyDAT9zIGnt97ojeL7TA6IRH489rERDVMgI",

 authDomain:
 "siano-4d901.firebaseapp.com",

 projectId:
 "siano-4d901",

 storageBucket:
 "siano-4d901.firebasestorage.app",

 messagingSenderId:
 "224378787783",

 appId:
 "1:224378787783:web:8cf1ef2409e955e0a62be2",

 measurementId:
 "G-8C4QPQRW6H"

};


const firebaseApp =
 initializeApp(firebaseConfig);

const auth =
 getAuth(firebaseApp);

const db =
 getFirestore(firebaseApp);


/* =====================================================
   DATOS
===================================================== */

let currentUser = null;

let playerData = {

 username:"",

 coins:20,

 avatar:{

  skin:"#ffcc99",

  shirt:"#00a8ff",

  pants:"#292d3d",

  accessory:"none"

 },

 ownedItems:[]

};


const skins = [
 "#ffcc99",
 "#e0ac69",
 "#c68642",
 "#8d5524",
 "#f1c27d",
 "#ffe0bd"
];

const shirts = [
 "#00a8ff",
 "#ff3d7f",
 "#ffd700",
 "#00ff88",
 "#6a5cff",
 "#ffffff",
 "#252535"
];

const pants = [
 "#292d3d",
 "#182b4a",
 "#4a321f",
 "#111111",
 "#556b2f",
 "#555555"
];


/* =====================================================
   LOGIN CON FIREBASE AUTH
===================================================== */

function fakeEmail(username){

 return username
  .toLowerCase()
  .replace(/[^a-z0-9]/g,"")
  +"@bloxverse.local";

}


document
.getElementById("loginButton")
.addEventListener("click",async()=>{

 const username =
  document.getElementById("username")
  .value
  .trim();

 const password =
  document.getElementById("password")
  .value;

 const error =
  document.getElementById("loginError");


 error.textContent="";


 if(username.length<3){

  error.textContent=
   "El nombre debe tener mínimo 3 caracteres.";

  return;

 }


 if(password.length<6){

  error.textContent=
   "La contraseña necesita mínimo 6 caracteres.";

  return;

 }


 const email =
  fakeEmail(username);


 try{

  try{

   const credential =
    await signInWithEmailAndPassword(
     auth,
     email,
     password
    );

   currentUser =
    credential.user;

  }catch(loginError){

   const credential =
    await createUserWithEmailAndPassword(
     auth,
     email,
     password
    );

   currentUser =
    credential.user;

  }


  await loadPlayer();

  enterLobby();


 }catch(errorFirebase){

  console.error(errorFirebase);

  error.textContent=
   "No se pudo iniciar sesión.";

 }

});


/* =====================================================
   PLAYER FIRESTORE
===================================================== */

async function loadPlayer(){

 const ref =
  doc(
   db,
   "players",
   currentUser.uid
  );

 const snap =
  await getDoc(ref);


 if(snap.exists()){

  playerData =
   Object.assign(
    playerData,
    snap.data()
   );

 }else{

  playerData.username =
   document
   .getElementById("username")
   .value
   .trim();

  await setDoc(
   ref,
   playerData
  );

 }

}


async function savePlayer(){

 if(!currentUser)
  return;

 await setDoc(
  doc(
   db,
   "players",
   currentUser.uid
  ),
  playerData,
  {
   merge:true
  }
 );

}


/* =====================================================
   LOBBY
===================================================== */

function enterLobby(){

 document
 .getElementById("usernameDisplay")
 .textContent=
 playerData.username;

 document
 .getElementById("avatarSmall")
 .textContent=
 playerData.username
 .charAt(0)
 .toUpperCase();

 updateCoins();

 buildGames();

 buildAvatar();

 buildMarketplace();

 showScreen("lobbyScreen");

}


function updateCoins(){

 document
 .getElementById("coins")
 .textContent=
 "🪙 "+
 playerData.coins+
 " YEIBUX";

}


function showScreen(id){

 document
 .querySelectorAll(".screen")
 .forEach(
  s=>s.classList.remove("active")
 );

 document
 .getElementById(id)
 .classList.add("active");

}


</script>
